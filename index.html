<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

.container {
  width: min(900px, 94%);
  margin: 40px auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
  color: #111827;
}

.header p {
  margin-top: 8px;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

textarea,
input[type="text"],
input[type="number"] {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

textarea:focus,
input:focus {
  border-color: #2563eb;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-top: 20px;
}

.field {
  margin-bottom: 5px;
}

.color-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

input[type="color"] {
  width: 55px;
  height: 45px;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.generate {
  width: 100%;
  margin-top: 25px;
  background: #2563eb;
  color: white;
}

.generate:hover {
  background: #1d4ed8;
}

.result {
  margin-top: 25px;
  text-align: center;
  padding: 25px;
  background: #f8fafc;
  border-radius: 16px;
}

#qrImage {
  display: block;
  max-width: 100%;
  width: 350px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 12px;
}

.download {
  display: inline-block;
  margin-top: 20px;
  background: #16a34a;
  color: white;
  text-decoration: none;
  padding: 14px 25px;
  border-radius: 12px;
  font-weight: bold;
}

.download:hover {
  background: #15803d;
}

.status {
  margin-top: 12px;
  color: #6b7280;
  font-size: 14px;
}

.logo-preview {
  display: none;
  max-width: 80px;
  max-height: 80px;
  margin-top: 10px;
}

.footer {
  text-align: center;
  color: #9ca3af;
  font-size: 13px;
  margin-top: 20px;
}

@media (max-width: 650px) {

  .container {
    margin: 20px auto;
  }

  .card {
    padding: 18px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 26px;
  }

  #qrImage {
    width: 280px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>QR Code Generator</h1>
    <p>สร้าง QR Code ง่าย ๆ พร้อมดาวน์โหลด</p>
  </div>

  <div class="card">

    <div class="field">
      <label for="text">ลิงก์ หรือ ข้อความ</label>

      <textarea
        id="text"
        placeholder="เช่น https://google.com หรือข้อความที่ต้องการสร้าง QR Code"
      ></textarea>
    </div>


    <div class="grid">

      <div>
        <label>สี QR Code</label>

        <div class="color-row">
          <input type="color" id="qrColor" value="#000000">
          <span id="qrColorText">#000000</span>
        </div>
      </div>


      <div>
        <label>สีพื้นหลัง</label>

        <div class="color-row">
          <input type="color" id="bgColor" value="#ffffff">
          <span id="bgColorText">#ffffff</span>
        </div>
      </div>


      <div>
        <label for="size">ขนาด QR</label>

        <input
          type="number"
          id="size"
          value="500"
          min="200"
          max="1500"
        >
      </div>


      <div>
        <label for="margin">ขอบ QR</label>

        <input
          type="number"
          id="margin"
          value="10"
          min="0"
          max="50"
        >
      </div>

    </div>


    <div style="margin-top:20px">

      <label for="logo">โลโก้ (ไม่บังคับ)</label>

      <input
        type="file"
        id="logo"
        accept="image/*"
      >

      <img
        id="logoPreview"
        class="logo-preview"
      >

    </div>


    <button
      class="generate"
      onclick="generateQR()"
    >
      ✨ สร้าง QR Code
    </button>


    <div class="result">

      <div id="message">
        กรอกข้อความด้านบน แล้วกด "สร้าง QR Code"
      </div>

      <img
        id="qrImage"
        style="display:none"
        alt="QR Code"
      >

      <div id="status" class="status"></div>

      <a
        id="downloadButton"
        class="download"
        style="display:none"
        download="qrcode.png"
      >
        ⬇️ ดาวน์โหลด QR Code
      </a>

    </div>

  </div>

  <div class="footer">
    QR Code Generator
  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const textInput = document.getElementById("text");
const qrColor = document.getElementById("qrColor");
const bgColor = document.getElementById("bgColor");
const sizeInput = document.getElementById("size");
const marginInput = document.getElementById("margin");
const logoInput = document.getElementById("logo");

const qrImage = document.getElementById("qrImage");
const downloadButton = document.getElementById("downloadButton");
const message = document.getElementById("message");
const statusText = document.getElementById("status");

const logoPreview = document.getElementById("logoPreview");


/* =========================
   COLOR DISPLAY
========================= */

qrColor.addEventListener("input", function() {
  document.getElementById("qrColorText").textContent = this.value;
});

bgColor.addEventListener("input", function() {
  document.getElementById("bgColorText").textContent = this.value;
});


/* =========================
   LOGO PREVIEW
========================= */

logoInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) {
    logoPreview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    logoPreview.src = e.target.result;
    logoPreview.style.display = "block";
  };

  reader.readAsDataURL(file);

});


/* =========================
   GENERATE QR
========================= */

function generateQR() {

  const text = textInput.value.trim();

  if (!text) {

    alert("กรุณากรอกลิงก์หรือข้อความก่อน");

    textInput.focus();

    return;
  }


  const colorDark = qrColor.value.replace("#", "");
  const colorLight = bgColor.value.replace("#", "");

  const size = parseInt(sizeInput.value) || 500;
  const margin = parseInt(marginInput.value) || 10;


  message.textContent = "กำลังสร้าง QR Code...";
  statusText.textContent = "";

  qrImage.style.display = "none";
  downloadButton.style.display = "none";


  /*
    QR Server API

    ไม่ต้องติดตั้ง Library
    ไม่ต้องใช้ EasyQRCodeJS
    ไม่ต้องใช้ jsPDF
  */

  const url =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=" + size + "x" + size +
    "&data=" + encodeURIComponent(text) +
    "&color=" + colorDark +
    "&bgcolor=" + colorLight +
    "&qzone=" + margin;


  const newImage = new Image();


  newImage.onload = function() {

    qrImage.src = newImage.src;

    qrImage.style.display = "block";

    message.textContent = "สร้าง QR Code สำเร็จ";

    statusText.textContent =
      "สามารถกดปุ่มด้านล่างเพื่อดาวน์โหลดได้เลย";


    /*
      ใช้ลิงก์ภาพโดยตรง
      ไม่ใช้ Canvas
      จึงไม่เจอปัญหา CORS / Canvas Tainted
    */

    downloadButton.href = newImage.src;

    downloadButton.download = "qrcode.png";

    downloadButton.style.display = "inline-block";

  };


  newImage.onerror = function() {

    message.textContent = "ไม่สามารถสร้าง QR Code ได้";

    statusText.textContent =
      "กรุณาตรวจสอบอินเทอร์เน็ต แล้วลองใหม่อีกครั้ง";

  };


  newImage.src = url;

}


/* =========================
   ENTER SHORTCUT
========================= */

textInput.addEventListener("keydown", function(event) {

  if (event.ctrlKey && event.key === "Enter") {

    generateQR();

  }

});

</script>

</body>
</html>
