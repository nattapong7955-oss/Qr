<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Code Studio</title>

<style>

/* =========================================
   GLOBAL
========================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

    color: #172033;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(59,130,246,.16),
            transparent 30%
        ),
        #f6f8fc;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 15px;

}


/* =========================================
   MAIN CARD
========================================= */

.app {

    width: 100%;

    max-width: 960px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(300px, 380px);

    background:
        rgba(255,255,255,.88);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border:
        1px solid rgba(255,255,255,.8);

    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(15,23,42,.12);

}


/* =========================================
   LEFT PANEL
========================================= */

.editor {

    padding: 42px;

}


/* Header */

.brand {

    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 32px;

}


.brand-icon {

    width: 52px;

    height: 52px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    box-shadow:
        0 10px 25px rgba(79,70,229,.28);

}


.brand h1 {

    margin: 0;

    font-size: 25px;

    letter-spacing: -.5px;

}


.brand p {

    margin: 4px 0 0;

    font-size: 13px;

    color: #64748b;

}


/* =========================================
   FORM
========================================= */

.form-group {

    margin-bottom: 22px;

}


label {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;

    color: #334155;

}


textarea,
input[type="text"] {

    width: 100%;

    border: 1px solid #dbe2ea;

    background: #f8fafc;

    border-radius: 13px;

    padding: 13px 14px;

    font-size: 14px;

    font-family: inherit;

    color: #172033;

    outline: none;

    transition:
        .2s ease;

}


textarea {

    height: 105px;

    resize: vertical;

    min-height: 80px;

}


textarea:focus,
input[type="text"]:focus {

    background: white;

    border-color: #6366f1;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.10);

}


/* =========================================
   COLORS
========================================= */

.color-pickers {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

}


.color-box {

    background: #f8fafc;

    border:
        1px solid #e2e8f0;

    border-radius: 14px;

    padding: 12px;

}


.color-title {

    font-size: 13px;

    font-weight: 700;

    color: #475569;

    margin-bottom: 9px;

}


.color-control {

    display: flex;

    align-items: center;

    gap: 10px;

}


input[type="color"] {

    width: 48px;

    height: 38px;

    padding: 2px;

    border:
        1px solid #cbd5e1;

    border-radius: 9px;

    background: white;

    cursor: pointer;

}


.color-value {

    font-size: 12px;

    font-family: monospace;

    color: #64748b;

}


/* =========================================
   BUTTON
========================================= */

.generate {

    width: 100%;

    border: none;

    border-radius: 14px;

    padding: 15px;

    font-size: 15px;

    font-weight: 700;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    box-shadow:
        0 10px 25px rgba(37,99,235,.22);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


.generate:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 30px rgba(37,99,235,.28);

}


.generate:active {

    transform:
        translateY(0);

}


/* =========================================
   RIGHT PREVIEW
========================================= */

.preview {

    padding: 42px;

    background:
        linear-gradient(
            180deg,
            #f8faff,
            #eef3ff
        );

    border-left:
        1px solid #e7ebf3;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.preview-title {

    width: 100%;

    text-align: center;

    margin-bottom: 20px;

}


.preview-title h2 {

    margin: 0;

    font-size: 19px;

}


.preview-title p {

    margin: 5px 0 0;

    font-size: 12px;

    color: #64748b;

}


/* QR Card */

.qr-card {

    width: 100%;

    max-width: 310px;

    aspect-ratio: 1 / 1;

    background: white;

    border-radius: 22px;

    padding: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid #e2e8f0;

    box-shadow:
        0 15px 35px rgba(30,41,59,.10);

}


#qrcode {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode img {

    width: 100%;

    height: 100%;

    object-fit: contain;

}


/* =========================================
   DOWNLOAD
========================================= */

.download-button {

    width: 100%;

    max-width: 310px;

    margin-top: 18px;

    padding: 13px;

    border: none;

    border-radius: 13px;

    color: white;

    background: #16a34a;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    display: none;

    transition:
        .2s ease;

}


.download-button:hover {

    background: #15803d;

    transform:
        translateY(-1px);

}


/* =========================================
   STATUS
========================================= */

.status {

    min-height: 20px;

    margin-top: 12px;

    font-size: 12px;

    color: #64748b;

    text-align: center;

}


/* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 18px;

    font-size: 11px;

    color: #94a3b8;

    text-align: center;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 760px) {

    body {

        padding: 15px;

        align-items: flex-start;

    }


    .app {

        margin-top: 10px;

        grid-template-columns: 1fr;

        border-radius: 23px;

    }


    .editor {

        padding: 25px 20px;

    }


    .preview {

        padding: 30px 20px;

        border-left: none;

        border-top:
            1px solid #e7ebf3;

    }


    .brand {

        margin-bottom: 25px;

    }


    .brand h1 {

        font-size: 22px;

    }


    .qr-card {

        max-width: 290px;

    }


    .download-button {

        max-width: 290px;

    }

}


/* =========================================
   VERY SMALL SCREEN
========================================= */

@media (max-width: 380px) {

    .color-pickers {

        grid-template-columns: 1fr;

    }


    .editor {

        padding: 22px 16px;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================
     EDITOR
====================================== -->

<section class="editor">


    <div class="brand">

        <div class="brand-icon">
            QR
        </div>

        <div>

            <h1>
                QR Code Studio
            </h1>

            <p>
                สร้าง QR Code ของคุณเอง
            </p>

        </div>

    </div>



    <!-- TEXT -->

    <div class="form-group">

        <label for="text-input">

            <span>
                ลิงก์ หรือข้อความ
            </span>

        </label>


        <textarea
            id="text-input"
            placeholder="วางลิงก์ URL หรือพิมพ์ข้อความที่ต้องการ..."
        >https://www.google.com</textarea>

    </div>



    <!-- COLORS -->

    <div class="form-group">

        <label>

            <span>
                ปรับแต่งสี
            </span>

        </label>


        <div class="color-pickers">


            <div class="color-box">

                <div class="color-title">
                    สี QR Code
                </div>

                <div class="color-control">

                    <input
                        type="color"
                        id="dot-color"
                        value="#0f172a"
                    >

                    <span
                        id="dark-value"
                        class="color-value"
                    >
                        #0f172a
                    </span>

                </div>

            </div>



            <div class="color-box">

                <div class="color-title">
                    สีพื้นหลัง
                </div>

                <div class="color-control">

                    <input
                        type="color"
                        id="bg-color"
                        value="#ffffff"
                    >

                    <span
                        id="light-value"
                        class="color-value"
                    >
                        #ffffff
                    </span>

                </div>

            </div>


        </div>

    </div>



    <!-- LOGO -->

    <div class="form-group">

        <label for="logo-input">

            <span>
                โลโก้ตรงกลาง
            </span>

            <span
                style="
                font-size:11px;
                color:#94a3b8;
                font-weight:500;
                "
            >
                URL
            </span>

        </label>


        <input
            type="text"
            id="logo-input"
            placeholder="วาง URL รูปภาพ .png หรือ .jpg"
        >

    </div>



    <!-- CREATE -->

    <button
        class="generate"
        type="button"
        onclick="generateCustomQR()"
    >

        ✨ สร้าง QR Code

    </button>


</section>



<!-- ======================================
     PREVIEW
====================================== -->

<section class="preview">


    <div class="preview-title">

        <h2>
            ตัวอย่าง QR Code
        </h2>

        <p>
            QR Code ความละเอียดสูง
        </p>

    </div>


    <div class="qr-card">

        <div id="qrcode"></div>

    </div>


    <button
        id="download-button"
        class="download-button"
        type="button"
        onclick="downloadQR()"
    >

        ↓ ดาวน์โหลด QR Code

    </button>


    <div
        id="status"
        class="status"
    ></div>


    <div class="footer">

        QR Code Studio

    </div>


</section>


</div>



<script>

/* =========================================
   VARIABLES
========================================= */

let currentQR = "";


/* =========================================
   GENERATE QR
========================================= */

function generateCustomQR() {

    const text =
        document
        .getElementById("text-input")
        .value
        .trim();


    const dark =
        document
        .getElementById("dot-color")
        .value
        .replace("#", "");


    const light =
        document
        .getElementById("bg-color")
        .value
        .replace("#", "");


    const container =
        document
        .getElementById("qrcode");


    const download =
        document
        .getElementById("download-button");


    const status =
        document
        .getElementById("status");


    /* ตรวจสอบข้อความ */

    if (!text) {

        alert(
            "กรุณากรอกข้อความหรือลิงก์ก่อนครับ"
        );

        return;

    }


    /* ล้าง QR เก่า */

    container.innerHTML = "";

    download.style.display = "none";


    /* สร้าง URL */

    currentQR =
        "https://api.qrserver.com/v1/create-qr-code/"
        + "?size=1000x1000"
        + "&margin=20"
        + "&color=" + dark
        + "&bgcolor=" + light
        + "&data="
        + encodeURIComponent(text);


    /* สร้างรูป */

    const img =
        document.createElement("img");


    img.alt =
        "QR Code";


    img.onload = function() {

        container.innerHTML = "";

        container.appendChild(img);

        download.style.display =
            "block";

        status.innerText =
            "✓ สร้าง QR Code สำเร็จ";

    };


    img.onerror = function() {

        status.innerText =
            "ไม่สามารถสร้าง QR Code ได้";

        alert(
            "ไม่สามารถสร้าง QR Code ได้\n\n"
            + "กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่ครับ"
        );

    };


    img.src = currentQR;

}


/* =========================================
   DOWNLOAD
========================================= */

async function downloadQR() {

    if (!currentQR) {

        alert(
            "กรุณาสร้าง QR Code ก่อนครับ"
        );

        return;

    }


    try {

        const response =
            await fetch(currentQR);


        if (!response.ok) {

            throw new Error(
                "Download failed"
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "QR-Code.png";


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        URL.revokeObjectURL(url);

    }

    catch (error) {

        window.open(
            currentQR,
            "_blank"
        );

    }

}


/* =========================================
   COLOR PREVIEW
========================================= */

document
.getElementById("dot-color")
.addEventListener(
    "input",
    function() {

        document
        .getElementById("dark-value")
        .innerText =
            this.value;

        generateCustomQR();

    }
);


document
.getElementById("bg-color")
.addEventListener(
    "input",
    function() {

        document
        .getElementById("light-value")
        .innerText =
            this.value;

        generateCustomQR();

    }
);


/* =========================================
   AUTO GENERATE
========================================= */

window.addEventListener(
    "load",
    function() {

        generateCustomQR();

    }
);

</script>


</body>

</html>
