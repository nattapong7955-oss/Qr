<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#4f46e5">

<title>QR Code Studio</title>

<script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.6.2/dist/easy.qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(37,99,235,.12),
            transparent 30%
        ),
        #f5f7fb;

    color:#172033;
    padding:20px;
}


/* ==============================
   APP
============================== */

.app{
    max-width:1100px;
    margin:auto;

    background:#fff;

    border-radius:25px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(15,23,42,.12);
}


/* ==============================
   HEADER
============================== */

.header{

    padding:25px 30px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.icon{

    width:50px;
    height:50px;

    border-radius:15px;

    background:
        rgba(255,255,255,.18);

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:900;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:4px 0 0;
    font-size:12px;
    opacity:.85;
}

.version{
    font-size:11px;
    background:
        rgba(255,255,255,.15);
    padding:7px 10px;
    border-radius:20px;
}


/* ==============================
   MAIN
============================== */

.main{

    display:grid;

    grid-template-columns:
        1fr 390px;
}


/* ==============================
   EDITOR
============================== */

.editor{
    padding:30px;
}

.section{
    margin-bottom:22px;
}

.title{

    font-weight:800;

    font-size:15px;

    margin-bottom:10px;

    color:#1e293b;
}

label{

    display:block;

    font-size:13px;

    font-weight:700;

    color:#475569;

    margin-bottom:7px;
}

textarea,
input[type="text"],
select{

    width:100%;

    padding:12px;

    border:1px solid #dbe2ea;

    border-radius:11px;

    background:#f8fafc;

    font-family:inherit;

    font-size:14px;

    outline:none;
}

textarea{

    height:100px;

    resize:vertical;
}

textarea:focus,
input[type="text"]:focus,
select:focus{

    background:#fff;

    border-color:#6366f1;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.10);
}


/* ==============================
   COLOR
============================== */

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.color-card{

    padding:12px;

    border:1px solid #e2e8f0;

    border-radius:12px;

    background:#f8fafc;
}

.color-row{

    display:flex;

    align-items:center;

    gap:10px;
}

input[type="color"]{

    width:48px;

    height:38px;

    padding:2px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:white;

}

.hex{

    font-family:monospace;

    font-size:12px;

    color:#64748b;
}


/* ==============================
   RANGE
============================== */

.range-row{

    display:flex;

    align-items:center;

    gap:10px;
}

input[type="range"]{

    flex:1;

    accent-color:#4f46e5;
}

.range-value{

    min-width:45px;

    text-align:center;

    font-size:12px;

    font-weight:bold;

    color:#4f46e5;
}


/* ==============================
   LOGO
============================== */

.logo-box{

    border:2px dashed #cbd5e1;

    border-radius:13px;

    padding:15px;

    background:#f8fafc;

    text-align:center;
}

.logo-box input[type="file"]{

    width:100%;

    font-size:12px;
}

.logo-preview{

    display:none;

    width:70px;

    height:70px;

    object-fit:contain;

    margin:12px auto 0;

    padding:5px;

    background:white;

    border-radius:10px;

    border:1px solid #e2e8f0;
}


/* ==============================
   BUTTON
============================== */

.generate{

    width:100%;

    padding:15px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    box-shadow:
        0 8px 20px
        rgba(37,99,235,.22);
}

.generate:active{
    transform:scale(.98);
}


/* ==============================
   PREVIEW
============================== */

.preview{

    background:
        linear-gradient(
            180deg,
            #f8faff,
            #eef3ff
        );

    padding:30px;

    border-left:
        1px solid #e5e7eb;
}

.preview-title{

    text-align:center;

    margin-bottom:15px;
}

.preview-title h2{

    margin:0;

    font-size:19px;
}

.preview-title p{

    margin:4px 0;

    color:#64748b;

    font-size:12px;
}


/* ==============================
   QR
============================== */

.qr-container{

    background:white;

    border-radius:20px;

    padding:20px;

    border:1px solid #e2e8f0;

    box-shadow:
        0 15px 35px
        rgba(15,23,42,.09);

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:330px;
}

#qrcode{

    display:flex;

    justify-content:center;

    align-items:center;
}

#qrcode img,
#qrcode canvas{

    max-width:100%;

    height:auto;
}


/* ==============================
   DOWNLOAD
============================== */

.download-title{

    margin-top:18px;

    margin-bottom:9px;

    text-align:center;

    font-size:13px;

    font-weight:800;

    color:#334155;
}

.download-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.download-btn{

    border:0;

    border-radius:10px;

    padding:11px 5px;

    color:white;

    font-size:12px;

    font-weight:800;

    cursor:pointer;
}

.png{
    background:#16a34a;
}

.svg{
    background:#2563eb;
}

.pdf{
    background:#dc2626;
}

.open{
    background:#7c3aed;
}

.share{
    background:#0891b2;
}

.download-btn:active{
    transform:scale(.97);
}


/* ==============================
   STATUS
============================== */

.status{

    text-align:center;

    margin-top:10px;

    min-height:20px;

    font-size:12px;

    color:#64748b;
}


/* ==============================
   HISTORY
============================== */

.history{

    margin-top:25px;

    padding-top:18px;

    border-top:
        1px solid #e2e8f0;
}

.history-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;
}

.history-head strong{

    font-size:13px;
}

.clear{

    border:0;

    background:none;

    color:#dc2626;

    font-size:11px;

    cursor:pointer;
}

.history-list{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.history-item{

    display:flex;

    align-items:center;

    gap:9px;

    padding:8px;

    background:#f8fafc;

    border-radius:9px;

    cursor:pointer;
}

.history-item:hover{

    background:#eef2ff;
}

.history-item img{

    width:38px;

    height:38px;

    object-fit:contain;

    background:white;

    border-radius:6px;
}

.history-text{

    flex:1;

    min-width:0;
}

.history-text strong{

    display:block;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    font-size:11px;
}

.history-text small{

    color:#94a3b8;

    font-size:9px;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:800px){

    .main{

        grid-template-columns:1fr;
    }

    .preview{

        border-left:0;

        border-top:
            1px solid #e5e7eb;
    }

}


@media(max-width:500px){

    body{
        padding:7px;
    }

    .header{

        padding:20px;
    }

    .editor,
    .preview{

        padding:20px;
    }

    .header h1{

        font-size:20px;
    }

    .version{

        display:none;
    }

    .grid{

        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="icon">
            QR
        </div>

        <div>

            <h1>
                QR Code Studio
            </h1>

            <p>
                สร้าง QR Code แบบมืออาชีพ
            </p>

        </div>

    </div>

    <div class="version">
        V5.0
    </div>

</header>



<div class="main">


<!-- =========================================
     EDITOR
========================================= -->

<section class="editor">


<div class="section">

    <div class="title">
        01 · ข้อมูล QR Code
    </div>

    <label>
        ลิงก์เว็บไซต์ หรือข้อความ
    </label>

    <textarea
        id="textInput"
        placeholder="https://example.com"
    >https://www.google.com</textarea>

</div>



<div class="section">

    <div class="title">
        02 · สี QR Code
    </div>


    <div class="grid">


        <div class="color-card">

            <label>
                สี QR
            </label>

            <div class="color-row">

                <input
                    type="color"
                    id="darkColor"
                    value="#111827"
                >

                <span
                    class="hex"
                    id="darkHex"
                >
                    #111827
                </span>

            </div>

        </div>


        <div class="color-card">

            <label>
                สีพื้นหลัง
            </label>

            <div class="color-row">

                <input
                    type="color"
                    id="lightColor"
                    value="#ffffff"
                >

                <span
                    class="hex"
                    id="lightHex"
                >
                    #ffffff
                </span>

            </div>

        </div>


    </div>

</div>



<div class="section">

    <div class="title">
        03 · ขนาด QR
    </div>

    <div class="range-row">

        <input
            type="range"
            id="size"
            min="200"
            max="1000"
            step="50"
            value="500"
        >

        <span
            class="range-value"
            id="sizeValue"
        >
            500
        </span>

    </div>

</div>



<div class="section">

    <div class="title">
        04 · โลโก้
    </div>


    <div class="logo-box">

        <label>
            อัปโหลดโลโก้จากมือถือ
        </label>

        <input
            type="file"
            id="logoFile"
            accept="image/png,image/jpeg,image/webp"
        >


        <img
            id="logoPreview"
            class="logo-preview"
        >

    </div>


    <div style="margin-top:10px">

        <label>
            หรือ URL รูปภาพ
        </label>

        <input
            type="text"
            id="logoUrl"
            placeholder="https://example.com/logo.png"
        >

    </div>


    <div
        class="range-row"
        style="margin-top:12px"
    >

        <label
            style="
            margin:0;
            min-width:75px;
            "
        >
            ขนาดโลโก้
        </label>

        <input
            type="range"
            id="logoSize"
            min="10"
            max="25"
            value="18"
        >

        <span
            class="range-value"
            id="logoSizeValue"
        >
            18%
        </span>

    </div>

</div>



<div class="section">

    <div class="title">
        05 · ข้อความใต้ QR
    </div>

    <input
        type="text"
        id="caption"
        placeholder="เช่น สแกนเพื่อดูรายละเอียด"
    >

</div>



<div class="section">

    <div class="title">
        06 · รูปแบบกรอบ
    </div>

    <select id="frame">

        <option value="none">
            ไม่มีกรอบ
        </option>

        <option value="square">
            กรอบสี่เหลี่ยม
        </option>

        <option value="rounded">
            กรอบมน
        </option>

    </select>

</div>



<button
    class="generate"
    id="generateBtn"
    type="button"
>

    ✨ สร้าง QR Code

</button>



<div class="history">

    <div class="history-head">

        <strong>
            🕘 QR ล่าสุด
        </strong>

        <button
            class="clear"
            type="button"
            id="clearHistory"
        >
            ล้างประวัติ
        </button>

    </div>

    <div
        class="history-list"
        id="historyList"
    ></div>

</div>


</section>



<!-- =========================================
     PREVIEW
========================================= -->

<section class="preview">


<div class="preview-title">

    <h2>
        ตัวอย่าง QR Code
    </h2>

    <p>
        QR Code พร้อมดาวน์โหลด
    </p>

</div>



<div class="qr-container">

    <div id="qrcode"></div>

</div>



<div
    class="status"
    id="status"
>
    กำลังเตรียมระบบ...
</div>



<div class="download-title">
    ดาวน์โหลด
</div>


<div class="download-grid">

    <button
        class="download-btn png"
        id="pngBtn"
        type="button"
    >
        ⬇ PNG
    </button>

    <button
        class="download-btn svg"
        id="svgBtn"
        type="button"
    >
        ⬇ SVG
    </button>

    <button
        class="download-btn pdf"
        id="pdfBtn"
        type="button"
    >
        ⬇ PDF
    </button>

    <button
        class="download-btn open"
        id="openBtn"
        type="button"
    >
        🔗 เปิด QR
    </button>

    <button
        class="download-btn share"
        id="shareBtn"
        type="button"
    >
        📤 แชร์
    </button>

</div>


</section>


</div>

</div>



<script>

/* =====================================================
   QR CODE STUDIO V5
===================================================== */


/* ==============================
   VARIABLES
============================== */

let qrInstance = null;

let qrCanvas = null;

let logoData = "";

let currentText = "";

let isGenerating = false;

let lastGeneratedText = "";


/* ==============================
   ELEMENTS
============================== */

const textInput =
    document.getElementById("textInput");

const darkColor =
    document.getElementById("darkColor");

const lightColor =
    document.getElementById("lightColor");

const size =
    document.getElementById("size");

const logoFile =
    document.getElementById("logoFile");

const logoUrl =
    document.getElementById("logoUrl");

const logoSize =
    document.getElementById("logoSize");

const caption =
    document.getElementById("caption");

const frame =
    document.getElementById("frame");

const qrContainer =
    document.getElementById("qrcode");

const status =
    document.getElementById("status");


/* ==============================
   STATUS
============================== */

function setStatus(message){

    status.textContent =
        message;

}


/* ==============================
   CHECK LIBRARY
============================== */

function checkLibrary(){

    if(
        typeof QRCode ===
        "undefined"
    ){

        setStatus(
            "❌ ไม่พบ QR Library"
        );

        alert(
            "ไม่พบ QR Code Library\n\n"
            + "กรุณารีเฟรชหน้าเว็บและตรวจสอบอินเทอร์เน็ตครับ"
        );

        return false;
    }

    return true;
}


/* ==============================
   GENERATE
============================== */

function generateQR(){

    if(isGenerating)
        return;


    if(!checkLibrary())
        return;


    const text =
        textInput.value.trim();


    if(!text){

        setStatus(
            "⚠ กรุณากรอกข้อความ"
        );

        return;

    }


    currentText =
        text;


    isGenerating =
        true;


    setStatus(
        "กำลังสร้าง QR Code..."
    );


    qrContainer.innerHTML = "";


    const qrOptions = {

        text:
            text,

        width:
            parseInt(size.value),

        height:
            parseInt(size.value),

        colorDark:
            darkColor.value,

        colorLight:
            lightColor.value,

        correctLevel:
            QRCode.CorrectLevel.H,

        drawer:
            "canvas",

        quietZone:
            10,

        quietZoneColor:
            lightColor.value

    };


    /* ==========================
       LOGO
    ========================== */

    const logo =
        logoData ||
        logoUrl.value.trim();


    if(logo){

        qrOptions.logo =
            logo;

        qrOptions.logoWidth =
            parseInt(size.value)
            *
            (
                parseInt(
                    logoSize.value
                ) / 100
            );

        qrOptions.logoHeight =
            qrOptions.logoWidth;

        qrOptions.logoBackgroundColor =
            lightColor.value;

        qrOptions.logoBackgroundTransparent =
            false;

    }


    /* ==========================
       CREATE
    ========================== */

    try{

        qrInstance =
            new QRCode(
                qrContainer,
                qrOptions
            );


        setTimeout(
            function(){

                qrCanvas =
                    qrContainer.querySelector(
                        "canvas"
                    );


                if(!qrCanvas){

                    isGenerating =
                        false;

                    setStatus(
                        "❌ สร้าง QR ไม่สำเร็จ"
                    );

                    return;

                }


                drawCaption();


                isGenerating =
                    false;


                lastGeneratedText =
                    text;


                setStatus(
                    "✓ สร้าง QR Code สำเร็จ"
                );


                saveHistory();


            },
            500
        );


    }

    catch(error){

        console.error(
            error
        );


        isGenerating =
            false;


        setStatus(
            "❌ เกิดข้อผิดพลาด"
        );

    }

}


/* ==============================
   CAPTION
============================== */

function drawCaption(){

    if(!qrCanvas)
        return;


    const text =
        caption.value.trim();


    if(!text)
        return;


    const oldCanvas =
        qrCanvas;


    const width =
        oldCanvas.width;


    const qrHeight =
        oldCanvas.height;


    const newCanvas =
        document.createElement(
            "canvas"
        );


    const extra =
        80;


    newCanvas.width =
        width;


    newCanvas.height =
        qrHeight
        + extra;


    const ctx =
        newCanvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        lightColor.value;


    ctx.fillRect(
        0,
        0,
        newCanvas.width,
        newCanvas.height
    );


    ctx.drawImage(
        oldCanvas,
        0,
        0
    );


    ctx.fillStyle =
        darkColor.value;


    ctx.font =
        "bold 28px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        width / 2,
        qrHeight + 40
    );


    qrContainer.innerHTML = "";

    qrContainer.appendChild(
        newCanvas
    );


    qrCanvas =
        newCanvas;

}


/* ==============================
   PNG DOWNLOAD
============================== */

function downloadPNG(){

    if(!qrCanvas){

        alert(
            "กรุณาสร้าง QR Code ก่อนครับ"
        );

        return;

    }


    try{
