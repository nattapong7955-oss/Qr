<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#6366f1">

<title>QR Code Studio</title>


<!-- QR CODE STYLING -->
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>


<!-- jsPDF สำหรับ PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

    color: #172033;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(59,130,246,.16),
            transparent 30%
        ),

        #f5f7fb;

    padding: 25px 15px;

}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    background: rgba(255,255,255,.92);

    border: 1px solid rgba(255,255,255,.8);

    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 80px rgba(15,23,42,.13);

}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 25px 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    border-bottom: 1px solid #edf0f5;

}


.logo-title {

    display: flex;

    align-items: center;

    gap: 13px;

}


.logo-icon {

    width: 48px;

    height: 48px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 21px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    box-shadow:
        0 8px 20px rgba(79,70,229,.25);

}


.header h1 {

    margin: 0;

    font-size: 22px;

}


.header p {

    margin: 3px 0 0;

    font-size: 12px;

    color: #64748b;

}


.header-badge {

    background: #eef2ff;

    color: #4f46e5;

    border-radius: 30px;

    padding: 7px 12px;

    font-size: 11px;

    font-weight: 700;

}


/* =====================================================
   MAIN GRID
===================================================== */

.main {

    display: grid;

    grid-template-columns:
        1fr 430px;

}


/* =====================================================
   SETTINGS
===================================================== */

.settings {

    padding: 30px;

}


.section-title {

    font-size: 14px;

    font-weight: 800;

    color: #334155;

    margin-bottom: 14px;

}


.group {

    margin-bottom: 22px;

}


label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #475569;

}


textarea,
input[type="text"],
input[type="number"],
select {

    width: 100%;

    padding: 12px 13px;

    border-radius: 11px;

    border: 1px solid #dbe2ea;

    background: #f8fafc;

    color: #172033;

    font-size: 14px;

    font-family: inherit;

    outline: none;

    transition: .2s;

}


textarea {

    min-height: 90px;

    resize: vertical;

}


textarea:focus,
input[type="text"]:focus,
input[type="number"]:focus,
select:focus {

    background: white;

    border-color: #6366f1;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.10);

}


/* =====================================================
   TWO COLUMNS
===================================================== */

.two {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

}


/* =====================================================
   COLOR
===================================================== */

.color-card {

    padding: 12px;

    border-radius: 13px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

}


.color-card label {

    margin-bottom: 8px;

}


.color-row {

    display: flex;

    align-items: center;

    gap: 8px;

}


input[type="color"] {

    width: 48px;

    height: 38px;

    padding: 2px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    background: white;

    cursor: pointer;

}


.hex {

    font-family: monospace;

    font-size: 11px;

    color: #64748b;

}


/* =====================================================
   RANGE
===================================================== */

.range-row {

    display: flex;

    align-items: center;

    gap: 12px;

}


input[type="range"] {

    flex: 1;

    accent-color: #6366f1;

}


.range-value {

    min-width: 45px;

    text-align: right;

    font-size: 12px;

    font-weight: 700;

    color: #4f46e5;

}


/* =====================================================
   CHECKBOX
===================================================== */

.check-row {

    display: flex;

    gap: 9px;

    align-items: center;

    margin-top: 10px;

}


.check-row input {

    width: 17px;

    height: 17px;

    accent-color: #6366f1;

}


.check-row span {

    font-size: 13px;

    color: #475569;

}


/* =====================================================
   LOGO
===================================================== */

.logo-preview {

    display: none;

    align-items: center;

    gap: 10px;

    padding: 10px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 11px;

    margin-top: 10px;

}


.logo-preview img {

    width: 45px;

    height: 45px;

    object-fit: contain;

    border-radius: 8px;

    background: white;

}


.logo-preview span {

    font-size: 11px;

    color: #64748b;

}


/* =====================================================
   BUTTONS
===================================================== */

.primary {

    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 14px;

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    box-shadow:
        0 10px 25px rgba(37,99,235,.22);

    transition: .2s;

}


.primary:hover {

    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(37,99,235,.28);

}


.secondary {

    flex: 1;

    border: 1px solid #dbe2ea;

    border-radius: 11px;

    padding: 11px;

    background: white;

    color: #475569;

    font-weight: 700;

    cursor: pointer;

}


.secondary:hover {

    background: #f8fafc;

}


.button-row {

    display: flex;

    gap: 10px;

    margin-top: 10px;

}


/* =====================================================
   PREVIEW
===================================================== */

.preview {

    padding: 30px;

    background:
        linear-gradient(
            180deg,
            #f8faff,
            #eef3ff
        );

    border-left: 1px solid #e7ebf3;

    display: flex;

    flex-direction: column;

    align-items: center;

}


.preview-head {

    text-align: center;

    margin-bottom: 15px;

}


.preview-head h2 {

    margin: 0;

    font-size: 18px;

}


.preview-head p {

    margin: 5px 0;

    color: #64748b;

    font-size: 11px;

}


/* =====================================================
   QR
===================================================== */

.qr-box {

    width: 100%;

    max-width: 350px;

    aspect-ratio: 1 / 1;

    padding: 18px;

    background: white;

    border-radius: 22px;

    border: 1px solid #e2e8f0;

    box-shadow:
        0 15px 40px rgba(30,41,59,.10);

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode canvas,
#qrcode svg {

    max-width: 100%;

    max-height: 100%;

}


/* =====================================================
   CAPTION
===================================================== */

.caption {

    margin-top: 12px;

    font-size: 13px;

    color: #334155;

    text-align: center;

    font-weight: 600;

    max-width: 330px;

}


/* =====================================================
   EXPORT
===================================================== */

.export {

    width: 100%;

    max-width: 350px;

    margin-top: 17px;

}


.export-title {

    text-align: center;

    font-size: 12px;

    color: #64748b;

    margin-bottom: 8px;

}


.export-grid {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 7px;

}


.export-btn {

    border: 1px solid #dbe2ea;

    border-radius: 10px;

    padding: 10px 4px;

    background: white;

    cursor: pointer;

    font-size: 11px;

    font-weight: 800;

    color: #334155;

}


.export-btn:hover {

    background: #f8fafc;

    border-color: #6366f1;

    color: #4f46e5;

}


.status {

    min-height: 18px;

    margin-top: 10px;

    text-align: center;

    font-size: 11px;

    color: #64748b;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    body {

        padding: 10px;

    }


    .header {

        padding: 20px;

    }


    .header-badge {

        display: none;

    }


    .main {

        grid-template-columns: 1fr;

    }


    .settings {

        padding: 22px;

    }


    .preview {

        padding: 25px 20px 30px;

        border-left: none;

        border-top: 1px solid #e7ebf3;

    }


    .qr-box {

        max-width: 310px;

    }

}


@media(max-width:400px) {

    .two {

        grid-template-columns: 1fr;

    }


    .export-grid {

        grid-template-columns:
            repeat(2,1fr);

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     HEADER
================================================= -->

<header class="header">

    <div class="logo-title">

        <div class="logo-icon">
            QR
        </div>

        <div>

            <h1>
                QR Code Studio
            </h1>

            <p>
                เครื่องมือสร้าง QR Code แบบมืออาชีพ
            </p>

        </div>

    </div>


    <div class="header-badge">
        V4 PRO
    </div>

</header>



<div class="main">


<!-- =================================================
     SETTINGS
================================================= -->

<section class="settings">


    <div class="section-title">
        เนื้อหา QR Code
    </div>


    <div class="group">

        <label>
            ลิงก์ หรือข้อความ
        </label>

        <textarea
            id="text"
            placeholder="https://example.com"
        >https://www.google.com</textarea>

        <div class="button-row">

            <button
                class="secondary"
                onclick="pasteText()"
            >
                📋 วาง
            </button>

            <button
                class="secondary"
                onclick="clearText()"
            >
                ✕ ล้าง
            </button>

        </div>

    </div>



    <!-- COLORS -->

    <div class="section-title">
        สี
    </div>


    <div class="group two">


        <div class="color-card">

            <label>
                สี QR
            </label>

            <div class="color-row">

                <input
                    type="color"
                    id="darkColor"
                    value="#111827"
                >

                <span
                    class="hex"
                    id="darkHex"
                >
                    #111827
                </span>

            </div>

        </div>



        <div class="color-card">

            <label>
                สีพื้นหลัง
            </label>

            <div class="color-row">

                <input
                    type="color"
                    id="lightColor"
                    value="#ffffff"
                >

                <span
                    class="hex"
                    id="lightHex"
                >
                    #ffffff
                </span>

            </div>

        </div>


    </div>



    <!-- GRADIENT -->

    <div class="group">

        <div class="check-row">

            <input
                type="checkbox"
                id="gradient"
            >

            <span>
                ใช้สีไล่ระดับ (Gradient)
            </span>

        </div>

    </div>



    <!-- DOT STYLE -->

    <div class="section-title">
        รูปแบบ QR
    </div>


    <div class="group two">


        <div>

            <label>
                รูปแบบจุด
            </label>

            <select id="dotType">

                <option value="square">
                    Square
                </option>

                <option value="rounded">
                    Rounded
                </option>

                <option value="dots">
                    Dots
                </option>

                <option value="classy">
                    Classy
                </option>

                <option value="classy-rounded">
                    Classy Rounded
                </option>

                <option value="extra-rounded">
                    Extra Rounded
                </option>

            </select>

        </div>



        <div>

            <label>
                รูปแบบมุม
            </label>

            <select id="cornerType">

                <option value="square">
                    Square
                </option>

                <option value="extra-rounded">
                    Rounded
                </option>

                <option value="dot">
                    Dot
                </option>

            </select>

        </div>


    </div>



    <!-- QR SETTINGS -->

    <div class="group two">


        <div>

            <label>
                Error Correction
            </label>

            <select id="errorLevel">

                <option value="L">
                    L - Low
                </option>

                <option value="M">
                    M - Medium
                </option>

                <option value="Q">
                    Q - Quartile
                </option>

                <option value="H" selected>
                    H - High
                </option>

            </select>

        </div>


        <div>

            <label>
                Margin
            </label>

            <div class="range-row">

                <input
                    type="range"
                    id="margin"
                    min="0"
                    max="40"
                    value="10"
                >

                <span
                    class="range-value"
                    id="marginValue"
                >
                    10
                </span>

            </div>

        </div>


    </div>



    <!-- LOGO -->

    <div class="section-title">
        โลโก้
    </div>


    <div class="group">

        <label>
            อัปโหลดโลโก้จากเครื่อง
        </label>

        <input
            type="file"
            id="logoFile"
            accept="image/png,image/jpeg,image/webp,image/svg+xml"
        >


        <div class="logo-preview"
             id="logoPreview">

            <img id="logoPreviewImg">

            <span>
                ใช้โลโก้นี้กับ QR Code
            </span>

        </div>

    </div>



    <div class="group">

        <label>
            หรือ URL รูปภาพโลโก้
        </label>

        <input
            type="text"
            id="logoUrl"
            placeholder="https://example.com/logo.png"
        >

    </div>



    <div class="group">

        <label>
            ขนาดโลโก้
        </label>

        <div class="range-row">

            <input
                type="range"
                id="logoSize"
                min="10"
                max="35"
                value="22"
            >

            <span
                class="range-value"
                id="logoSizeValue"
            >
                22%
            </span>

        </div>


        <div class="check-row">

            <input
                type="checkbox"
                id="hideDots"
                checked
            >

            <span>
                ซ่อนจุด QR ด้านหลังโลโก้
            </span>

        </div>

    </div>



    <!-- CAPTION -->

    <div class="section-title">
        ข้อความใต้ QR
    </div>


    <div class="group">

        <input
            type="text"
            id="caption"
            placeholder="เช่น สแกนเพื่อดูรายละเอียด"
        >

    </div>



    <!-- TRANSPARENT -->

    <div class="check-row">

        <input
            type="checkbox"
            id="transparent"
        >

        <span>
            พื้นหลังโปร่งใส
        </span>

    </div>


    <br>


    <button
        class="primary"
        onclick="generateQR()"
    >

        ✨ สร้าง / อัปเดต QR Code

    </button>


</section>



<!-- =================================================
     PREVIEW
================================================= -->

<section class="preview">


    <div class="preview-head">

        <h2>
            ตัวอย่าง QR Code
        </h2>

        <p>
            Preview แบบ Real-time
        </p>

    </div>



    <div class="qr-box">

        <div id="qrcode"></div>

    </div>



    <div
        class="caption"
        id="captionPreview"
    ></div>



    <!-- EXPORT -->

    <div class="export">

        <div class="export-title">
            ดาวน์โหลด / ส่งออก
        </div>


        <div class="export-grid">


            <button
                class="export-btn"
                onclick="downloadQR('png')"
            >
                🖼️ PNG
            </button>


            <button
                class="export-btn"
                onclick="downloadQR('jpeg')"
            >
                📷 JPG
            </button>


            <button
                class="export-btn"
                onclick="downloadQR('svg')"
            >
                🧩 SVG
            </button>


            <button
                class="export-btn"
                onclick="downloadPDF()"
            >
                📄 PDF
            </button>


        </div>

    </div>



    <div
        class="button-row"
        style="width:100%;max-width:350px;"
    >

        <button
            class="secondary"
            onclick="copyText()"
        >
            📋 คัดลอก
        </button>


        <button
            class="secondary"
            onclick="shareQR()"
        >
            📤 แชร์
        </button>


        <button
            class="secondary"
            onclick="resetAll()"
        >
            ↺ รีเซ็ต
        </button>

    </div>



    <div
        class="status"
        id="status"
    >
    </div>


</section>


</div>

</div>



<script>

/* =====================================================
   GLOBAL
===================================================== */

let qrCode = null;

let logoData = "";



/* =====================================================
   GET ELEMENT
===================================================== */

const $ = id =>
    document.getElementById(id);



/* =====================================================
   CREATE QR
===================================================== */

function generateQR() {

    const text =
        $("text").value.trim();


    if (!text) {

        alert(
            "กรุณากรอกลิงก์หรือข้อความก่อนครับ"
        );
