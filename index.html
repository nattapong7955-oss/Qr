<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Customizer V2</title>

<!-- EasyQRCodeJS -->
<script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.1/dist/easy.qrcode.min.js"></script>

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #cbd5e1;
    --input-bg: #ffffff;
    --preview-bg: #f8fafc;
    --danger: #dc2626;
    --success: #16a34a;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: 100%;
    max-width: 1180px;
    margin: auto;
    padding: 24px;
}

/* =========================
   Header
========================= */

.header {
    text-align: center;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
}

.header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
}

/* =========================
   Layout
========================= */

.workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
    gap: 22px;
    align-items: start;
}

.card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
    box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.07);
}

.section-title {
    font-size: 18px;
    font-weight: 750;
    margin: 0 0 18px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
}

.hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

/* =========================
   Inputs
========================= */

textarea,
input[type="text"],
input[type="number"],
select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    outline: none;
    transition: 0.2s;
}

textarea {
    min-height: 105px;
    resize: vertical;
}

textarea:focus,
input:focus,
select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

/* =========================
   Colors
========================= */

.color-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.color-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

input[type="color"] {
    width: 52px;
    height: 42px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: transparent;
}

.color-value {
    flex: 1;
    font-family: monospace;
    font-size: 13px;
}

/* =========================
   Range
========================= */

.range-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

input[type="range"] {
    flex: 1;
    accent-color: var(--primary);
}

.range-value {
    min-width: 48px;
    text-align: center;
    padding: 7px 8px;
    border-radius: 8px;
    background: var(--preview-bg);
    font-size: 13px;
    font-weight: 700;
}

/* =========================
   Upload
========================= */

.upload-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.upload-box:hover {
    border-color: var(--primary);
    background: rgba(37, 99, 235, 0.04);
}

.upload-box strong {
    display: block;
    margin-bottom: 5px;
}

.upload-box span {
    color: var(--muted);
    font-size: 12px;
}

#logo-file {
    display: none;
}

.logo-preview {
    display: none;
    margin-top: 12px;
    align-items: center;
    gap: 12px;
}

.logo-preview img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
}

.logo-info {
    flex: 1;
    min-width: 0;
}

.logo-name {
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.remove-logo {
    border: 0;
    background: #fee2e2;
    color: var(--danger);
    width: auto;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
}

/* =========================
   URL Logo
========================= */

.logo-url-toggle {
    margin-top: 10px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.logo-url-area {
    display: none;
    margin-top: 10px;
}

/* =========================
   Buttons
========================= */

.btn {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 750;
    transition: 0.2s;
}

.btn:active {
    transform: translateY(1px);
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #e2e8f0;
    color: #0f172a;
}

.btn-secondary:hover {
    background: #cbd5e1;
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-danger {
    background: #fee2e2;
    color: var(--danger);
}

.button-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.button-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.action-main {
    margin-top: 8px;
}

/* =========================
   Preview
========================= */

.preview-card {
    position: sticky;
    top: 20px;
}

.preview-area {
    min-height: 390px;
    border: 2px dashed #e2e8f0;
    border-radius: 15px;
    background:
        linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
        linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
        linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.qr-wrapper {
    background: white;
    padding: 10px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

#qrcode {
    line-height: 0;
}

#qrcode img,
#qrcode canvas {
    max-width: 100%;
    height: auto;
}

.empty-preview {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
}

/* =========================
   Status
========================= */

.status {
    margin-top: 12px;
    min-height: 20px;
    font-size: 13px;
    text-align: center;
}

.status.error {
    color: var(--danger);
}

.status.success {
    color: var(--success);
}

/* =========================
   Footer
========================= */

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 22px;
}

/* =========================
   Dark Mode
========================= */

body.dark {
    --bg: #020617;
    --card: #0f172a;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --input-bg: #111827;
    --preview-bg: #1e293b;
}

body.dark .btn-secondary {
    background: #334155;
    color: white;
}

body.dark .upload-box:hover {
    background: rgba(59, 130, 246, 0.08);
}

body.dark .qr-wrapper {
    background: white;
}

/* =========================
   Mobile
========================= */

@media (max-width: 850px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .preview-card {
        position: static;
    }

    .preview-area {
        min-height: 330px;
    }
}

@media (max-width: 520px) {

    .app {
        padding: 12px;
    }

    .card {
        padding: 17px;
        border-radius: 15px;
    }

    .color-grid {
        grid-template-columns: 1fr;
    }

    .button-grid-3 {
        grid-template-columns: 1fr;
    }

    .header {
        margin-bottom: 16px;
    }

    .preview-area {
        min-height: 290px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>🔳 QR Code Customizer</h1>
        <p>สร้าง QR Code ปรับแต่งได้ พร้อมดาวน์โหลดและแชร์</p>
    </header>

    <main class="workspace">

        <!-- =========================
             SETTINGS
        ========================== -->

        <section class="card">

            <h2 class="section-title">⚙️ ตั้งค่า QR Code</h2>

            <!-- Text -->
            <div class="form-group">

                <label for="text-input">
                    🔗 ลิงก์เว็บไซต์ หรือข้อความ
                </label>

                <textarea
                    id="text-input"
                    maxlength="2000"
                    placeholder="วาง URL หรือพิมพ์ข้อความ..."
                >https://www.google.com</textarea>

                <div class="hint">
                    รองรับ URL ข้อความ เบอร์โทร อีเมล และข้อมูลทั่วไป
                </div>

            </div>

            <!-- Colors -->
            <div class="form-group">

                <label>🎨 สี QR Code</label>

                <div class="color-grid">

                    <div class="color-box">

                        <input
                            type="color"
                            id="dot-color"
                            value="#0f172a"
                        >

                        <input
                            type="text"
                            id="dot-color-text"
                            class="color-value"
                            value="#0f172a"
                            maxlength="7"
                        >

                    </div>

                    <div class="color-box">

                        <input
                            type="color"
                            id="bg-color"
                            value="#ffffff"
                        >

                        <input
                            type="text"
                            id="bg-color-text"
                            class="color-value"
                            value="#ffffff"
                            maxlength="7"
                        >

                    </div>

                </div>

            </div>

            <!-- QR Size -->
            <div class="form-group">

                <label for="qr-size">
                    📐 ขนาด QR Code
                </label>

                <div class="range-row">

                    <input
                        type="range"
                        id="qr-size"
                        min="160"
                        max="500"
                        step="10"
                        value="280"
                    >

                    <div class="range-value">
                        <span id="qr-size-value">280</span> px
                    </div>

                </div>

            </div>

            <!-- Error Correction -->
            <div class="form-group">

                <label for="error-level">
                    🛡️ ระดับการแก้ไขข้อผิดพลาด
                </label>

                <select id="error-level">

                    <option value="L">
                        L — ประมาณ 7%
                    </option>

                    <option value="M">
                        M — ประมาณ 15%
                    </option>

                    <option value="Q">
                        Q — ประมาณ 25%
                    </option>

                    <option value="H" selected>
                        H — ประมาณ 30% (แนะนำเมื่อใช้โลโก้)
                    </option>

                </select>

            </div>

            <!-- Logo -->
            <div class="form-group">

                <label>🖼️ โลโก้ตรงกลาง</label>

                <label
                    class="upload-box"
                    for="logo-file"
                >

                    <strong>📁 เลือกรูปจากเครื่อง</strong>

                    <span>
                        PNG / JPG / WEBP
                    </span>

                </label>

                <input
                    type="file"
                    id="logo-file"
                    accept="image/png,image/jpeg,image/webp"
                >

                <div
                    class="logo-preview"
                    id="logo-preview"
                >

                    <img
                        id="logo-preview-img"
                        alt="Logo Preview"
                    >

                    <div class="logo-info">

                        <div
                            class="logo-name"
                            id="logo-name"
                        ></div>

                    </div>

                    <button
                        type="button"
                        class="remove-logo"
                        id="remove-logo"
                    >
                        ลบ
                    </button>

                </div>

                <div
                    class="logo-url-toggle"
                    id="logo-url-toggle"
                >
                    หรือใช้ URL รูปภาพ
                </div>

                <div
                    class="logo-url-area"
                    id="logo-url-area"
                >

                    <input
                        type="text"
                        id="logo-input"
                        placeholder="https://example.com/logo.png"
                    >

                </div>

            </div>

            <!-- Logo Size -->
            <div class="form-group">

                <label for="logo-size">
                    🧩 ขนาดโลโก้
                </label>

                <div class="range-row">

                    <input
                        type="range"
                        id="logo-size"
                        min="30"
                        max="120"
                        step="5"
                        value="60"
                    >

                    <div class="range-value">
                        <span id="logo-size-value">60</span> px
                    </div>

                </div>

            </div>

            <!-- Caption -->
            <div class="form-group">

                <label for="caption">
                    ✏️ ข้อความใต้ QR Code
                </label>

                <input
                    type="text"
                    id="caption"
                    maxlength="100"
                    placeholder="เช่น SCAN ME"
                >

            </div>

            <!-- Buttons -->

            <div class="button-grid">

                <button
                    type="button"
                    class="btn btn-primary action-main"
                    id="generate-btn"
                >
                    🔄 สร้าง QR Code
                </button>

                <button
                    type="button"
                    class="btn btn-secondary action-main"
                    id="reset-btn"
                >
                    ↩️ รีเซ็ต
                </button>

            </div>

            <div class="button-grid-3" style="margin-top:10px;">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="dark-btn"
                >
                    🌙 ธีม
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="copy-btn"
                >
                    📋 Copy
                </button>

                <button
                    type="button"
                    class="btn btn-success"
                    id="share-btn"
                >
                    📤 แชร์
                </button>

            </div>

            <div
                id="status"
                class="status"
                aria-live="polite"
            ></div>

        </section>


        <!-- =========================
             PREVIEW
        ========================== -->

        <section class="card preview-card">

            <h2 class="section-title">
                👁️ ตัวอย่าง
            </h2>

            <div class="preview-area">

                <div class="qr-wrapper">

                    <div id="qrcode">

                        <div class="empty-preview">
                            QR Code จะแสดงที่นี่
                        </div>

                    </div>

                </div>

            </div>

            <!-- Download -->

            <div
                class="button-grid"
                style="margin-top:14px;"
            >

                <button
                    type="button"
                    class="btn btn-primary"
                    id="download-png"
                >
                    🖼️ PNG
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="download-svg"
                >
                    🧩 SVG
                </button>

            </div>

            <button
                type="button"
                class="btn btn-secondary"
                id="download-pdf"
                style="margin-top:10px;"
            >
                📄 พิมพ์ / บันทึกเป็น PDF
            </button>

            <div class="hint" style="text-align:center;margin-top:12px;">
                แนะนำให้ทดสอบสแกน QR ก่อนนำไปใช้งานจริง
            </div>

        </section>

    </main>

    <footer class="footer">
        QR Code Customizer V2 • ทำงานบนเบราว์เซอร์ของคุณ
    </footer>

</div>

.loading-spinner {
    width: 28px;
    height: 28px;

@media(max-width: 500px) {

    }

    .action-grid {
        grid-template-columns:

    }

    .preview-area {

    }
}

</style>

</head>

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let qrLibraryReady = false;

let qrInstance = null;

let qrDataUrl = "";

let logoData = "";

let renderTimer = null;

let statusTimer = null;


/* =========================================================
   SHORTCUT
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = "success"
) {

    const el =
        $("status");

    el.textContent =
        message;

    el.className =
        "status show " +
        type;

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function() {

                el.className =
                    "status";

            },
            2500
        );
}


/* =========================================================
   LOAD EXTERNAL SCRIPT
========================================================= */

function loadScript(url) {

    return new Promise(
        function(resolve, reject) {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                url;

            script.async =
                false;


            script.onload =
                function() {

                    resolve();

                };


            script.onerror =
                function() {

                    reject(
                        new Error(
                            "โหลด Library ไม่สำเร็จ"
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   LOAD QR LIBRARY
========================================================= */

async function loadQRCodeLibrary() {

    /*
     * CDN ตัวที่ 1
     */

    try {

        await loadScript(
            "https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Primary CDN failed",
            error
        );

    }


    /*
     * CDN ตัวที่ 2
     */

    try {

        await loadScript(
            "https://unpkg.com/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Fallback CDN failed",
            error
        );

    }


    return false;
}


/* =========================================================
   INIT LIBRARY
========================================================= */

async function initializeQRCode() {

    const ready =
        await loadQRCodeLibrary();


    if (!ready) {

        $("qrcode").innerHTML = `

            <div class="error-box">

                <strong>
                    ไม่สามารถโหลด QR Generator ได้
                </strong>

                <br><br>

                ตรวจสอบ Internet แล้ว
                รีเฟรชหน้าเว็บอีกครั้ง

            </div>

        `;


        showStatus(
            "โหลด QR Generator ไม่สำเร็จ",
            "error"
        );

        return;

    }


    qrLibraryReady =
        true;


    /*
     * สำคัญ:
     * เริ่มต้นด้วยค่าที่กำหนดใน HTML
     * ก่อนอ่าน localStorage
     */

    loadSettings();


    updateUI();


    /*
     * ถ้า localStorage เคยเก็บค่าว่าง
     * ให้ใช้ Google แทน
     */

    if (
        !$("textInput").value.trim()
    ) {

        $("textInput").value =
            "https://www.google.com";

    }


    generateQR();


    showStatus(
        "QR Generator พร้อมใช้งาน",
        "success"
    );

}


/* =========================================================
   GET ERROR CORRECTION
========================================================= */

function getCorrectLevel() {

    switch (
        $("errorCorrection").value
    ) {

        case "L":
            return QRCode.CorrectLevel.L;

        case "Q":
            return QRCode.CorrectLevel.Q;

        case "H":
            return QRCode.CorrectLevel.H;

        case "M":
        default:
            return QRCode.CorrectLevel.M;

    }

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    $("darkColorText").textContent =
        $("darkColor").value;


    $("lightColorText").textContent =
        $("lightColor").value;


    $("captionColorText").textContent =
        $("captionColor").value;


    $("qrSizeText").textContent =
        $("qrSize").value +
        "px";


    $("logoSizeText").textContent =
        $("logoSize").value +
        "px";


    $("captionSizeText").textContent =
        $("captionSize").value +
        "px";


    const text =
        $("textInput").value;


    $("characterCount").textContent =
        text.length +
        " ตัวอักษร";


    $("sizeInfo").textContent =
        $("qrSize").value +
        " × " +
        $("qrSize").value +
        " px";


    /*
     * Caption
     */

    const caption =
        $("caption");


    caption.textContent =
        $("captionInput").value;


    caption.style.color =
        $("captionColor").value;


    caption.style.fontSize =
        $("captionSize").value +
        "px";


    caption.style.fontWeight =
        "600";

}


/* =========================================================
   GENERATE QR
========================================================= */

function generateQR() {

    if (!qrLibraryReady) {

        return;

    }


    let text =
        $("textInput").value.trim();


    /*
     * ป้องกัน text ว่าง
     */

    if (!text) {

        text =
            "https://www.google.com";

        $("textInput").value =
            text;

    }


    const container =
        $("qrcode");


    container.innerHTML =
        "";


    qrDataUrl =
        "";


    const size =
        Number(
            $("qrSize").value
        );


    /*
     * QR Options
     */

    const options = {

        text: text,

        width: size,

        height: size,

        colorDark:
            $("darkColor").value,

        colorLight:
            $("lightColor").value,

        correctLevel:
            getCorrectLevel(),

        quietZone: 8,

        quietZoneColor:
            $("lightColor").value,

        dotScale: 1,

        utf8WithoutBOM: true,

        drawer: "canvas",

        /*
         * เมื่อสร้างเสร็จ
         */

        onRenderingEnd:
            function(
                options,
                dataURL
            ) {

                if (dataURL) {

                    qrDataUrl =
                        dataURL;

                }


                updateUI();

            }

    };


    /*
     * LOGO
     */

    const logo =
        logoData ||
        $("logoUrl").value.trim();


    if (logo) {

        options.logo =
            logo;

        options.logoWidth =
            Number(
                $("logoSize").value
            );

        options.logoHeight =
            Number(
                $("logoSize").value
            );

        options.logoBackgroundTransparent =
            !$("logoBackground").checked;

        options.logoBackgroundColor =
            $("lightColor").value;

    }


    try {

        qrInstance =
            new QRCode(
                container,
                options
            );


        updateUI();


    } catch (error) {

        console.error(
            "QR generation error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <strong>
                    สร้าง QR Code ไม่สำเร็จ
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}

            </div>

        `;


        showStatus(
            "เกิดข้อผิดพลาดในการสร้าง QR",
            "error"
        );

    }

}


/* =========================================================
   DEBOUNCE
========================================================= */

function scheduleGenerate() {

    updateUI();


    clearTimeout(
        renderTimer
    );


    renderTimer =
        setTimeout(
            function() {

                generateQR();

                saveSettings();

            },
            250
        );

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    /*
     * อย่าเก็บ logo Base64
     * เพราะอาจมีขนาดใหญ่มาก
     */

    const data = {

        text:
            $("textInput").value,

        dark:
            $("darkColor").value,

        light:
            $("lightColor").value,

        qrSize:
            $("qrSize").value,

        logoSize:
            $("logoSize").value,

        error:
            $("errorCorrection").value,

        caption:
            $("captionInput").value,

        captionColor:
            $("captionColor").value,

        captionSize:
            $("captionSize").value,

        logoBackground:
            $("logoBackground").checked,

        logoUrl:
            $("logoUrl").value

    };


    try {

        localStorage.setItem(
            "qrCustomizerV22",
            JSON.stringify(
                data
            )
        );

    } catch (error) {

        console.log(
            "localStorage error",
            error
        );

    }

}


/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    let raw = null;


    try {

        raw =
            localStorage.getItem(
                "qrCustomizerV22"
            );

    } catch (error) {

        return;

    }


    if (!raw) {

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        /*
         * สำคัญมาก:
         * ถ้าค่าว่าง ไม่เอามาทับค่า default
         */

        if (
            typeof data.text === "string" &&
            data.text.trim() !== ""
        ) {

            $("textInput").value =
                data.text;

        }


        if (
            data.dark
        ) {

            $("darkColor").value =
                data.dark;

        }


        if (
            data.light
        ) {

            $("lightColor").value =
                data.light;

        }


        if (
            data.qrSize
        ) {

            $("qrSize").value =
                data.qrSize;

        }


        if (
            data.logoSize
        ) {

            $("logoSize").value =
                data.logoSize;

        }


        if (
            data.error
        ) {

            $("errorCorrection").value =
                data.error;

        }


        if (
            typeof data.caption ===
            "string"
        ) {

            $("captionInput").value =
                data.caption;

        }


        if (
            data.captionColor
        ) {

            $("captionColor").value =
                data.captionColor;

        }


        if (
            data.captionSize
        ) {

            $("captionSize").value =
                data.captionSize;

        }


        if (
            typeof data.logoBackground ===
            "boolean"
        ) {

            $("logoBackground").checked =
                data.logoBackground;

        }


        if (
            typeof data.logoUrl ===
            "string"
        ) {

            $("logoUrl").value =
                data.logoUrl;

        }

    } catch (error) {

        console.log(
            "Settings corrupted"
        );


        /*
         * ล้างเฉพาะ Settings ที่เสีย
         */

        localStorage.removeItem(
            "qrCustomizerV22"
        );

    }

}


/* =========================================================
   DOWNLOAD PNG
========================================================= */

function downloadPNG() {

    if (!qrInstance) {

        showStatus(
            "QR Code ยังไม่พร้อม",
            "error"
        );

        return;

    }


    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ไม่พบภาพ QR",
            "error"
        );

        return;

    }


    const caption =
        $("captionInput")
            .value
            .trim();


    /*
     * ไม่มี Caption
     */

    if (!caption) {

        downloadCanvas(
            canvas,
            "qr-code.png"
        );

        return;

    }


    /*
     * มี Caption
     */

    const padding =
        30;


    const fontSize =
        Number(
            $("captionSize").value
        );


    const textHeight =
        fontSize +
        30;


    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width +
        padding * 2;


    output.height =
        canvas.height +
        padding * 2 +
        textHeight;


    const ctx =
        output.getContext(
            "2d"
        );


    /*
     * Background
     */

    ctx.fillStyle =
        $("lightColor").value;


    ctx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    /*
     * QR
     */

    ctx.drawImage(
        canvas,
        padding,
        padding
    );


    /*
     * Caption
     */

    ctx.fillStyle =
        $("captionColor").value;


    ctx.font =
        "600 " +
        fontSize +
        "px Segoe UI";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        caption,
        output.width / 2,
        canvas.height +
        padding +
        textHeight / 2
    );


    downloadCanvas(
        output,
        "qr-code.png"
    );

}


/* =========================================================
   DOWNLOAD CANVAS
========================================================= */

function downloadCanvas(
    canvas,
    filename
) {

    try {

        canvas.toBlob(
            function(blob) {

                if (!blob) {

                    showStatus(
                        "สร้างไฟล์ PNG ไม่สำเร็จ",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;

                link.download =
                    filename;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    function() {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );


                showStatus(
                    "ดาวน์โหลด PNG แล้ว",
                    "success"
                );

            },
            "image/png"
        );

    } catch (error) {

        console.error(
            error
        );

        showStatus(
            "ไม่สามารถดาวน์โหลด PNG ได้",
            "error"
        );

    }

}


/* =========================================================
   DOWNLOAD SVG

function downloadSVG() {

        );

    }

    }


    const container =

            ),

            ),

        colorDark:
            $("darkColor").value,

        colorLight:
            $("lightColor").value,

        correctLevel:
            getCorrectLevel(),

        quietZone: 8,

        quietZoneColor:
            $("lightColor").value,

        drawer: "svg"

    };


    /*

     */

                    );

                    );

                    );

        );

        );

        );

}


/* =========================================================
   COPY QR
========================================================= */

async function copyQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.clipboard ||
        typeof ClipboardItem ===
        "undefined"
    ) {

        showStatus(
            "Browser ไม่รองรับ Copy รูปภาพ",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        await navigator.clipboard.write([

            new ClipboardItem({

                "image/png":
                    blob

            })

        ]);


        showStatus(
            "คัดลอก QR แล้ว",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Copy ไม่สำเร็จ",
            "error"
        );

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.share
    ) {

        showStatus(
            "อุปกรณ์นี้ไม่รองรับ Share",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        const file =
            new File(
                [blob],
                "qr-code.png",
                {
                    type:
                        "image/png"
                }
            );


        if (
            navigator.canShare &&
            !navigator.canShare({
                files: [file]
            })
        ) {

            showStatus(
                "อุปกรณ์นี้ไม่รองรับ Share รูปภาพ",
                "error"
            );

            return;

        }


        await navigator.share({

            title:
                "QR Code",

            text:
                $("captionInput").value ||
                "QR Code",

            files:
                [file]

        });


    } catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );

        }

    }

}


/* =========================================================
   PRINT
========================================================= */

function printQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    const image =
        canvas.toDataURL(
            "image/png"
        );


    const caption =
        escapeHTML(
            $("captionInput").value
        );


    const win =
        window.open(
            "",
            "_blank"
        );


    if (!win) {

        showStatus(
            "Browser บล็อกหน้าต่างพิมพ์",
            "error"
        );

        return;

    }


    win.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>QR Code</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}

    max-width: 80vw;

    max-height: 75vh;

}

    margin-top: 15px;

    font-size: 22px;

}

</style>

</head>

<body>

<img src="${image}">

<div class="caption">
${caption}
</div>

<script>

window.onload = function() {

    window.print();

};

<\/script>

</body>

</html>

    `);


    win.document.close();

}


/* =========================================================
   LOGO FILE
========================================================= */

$("logoFile")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files &&
                this.files[0];


            if (!file) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showStatus(
                    "กรุณาเลือกไฟล์รูปภาพ",
                    "error"
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    logoData =
                        event.target.result;


                    $("logoUrl").value =
                        "";


                    $("logoPreviewImage").src =
                        logoData;


                    $("logoPreview").style.display =
                        "block";


                    generateQR();

                };


            reader.onerror =
                function() {

                    showStatus(
                        "อ่านไฟล์โลโก้ไม่สำเร็จ",
                        "error"
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );


/* =========================================================
   LOGO URL
========================================================= */

$("logoUrl")
    .addEventListener(
        "change",
        function() {

            const url =
                this.value.trim();


            if (!url) {

                logoData =
                    "";

                $("logoPreview")
                    .style.display =
                    "none";


                generateQR();

                return;

            }


            logoData =
                "";


            $("logoPreviewImage").src =
                url;


            $("logoPreview").style.display =
                "block";


            generateQR();

        }
    );


/* =========================================================
   REALTIME CONTROLS
========================================================= */

[
    "textInput",
    "darkColor",
    "lightColor",
    "qrSize",
    "logoSize",
    "errorCorrection",
    "captionInput",
    "captionColor",
    "captionSize",
    "logoBackground"

].forEach(
    function(id) {

        $(id)
            .addEventListener(

                scheduleGenerate

        $(id)
            .addEventListener(

);


/* =========================================================
   GENERATE BUTTON
========================================================= */

$("generateButton")
    .addEventListener(
        "click",
        function() {

            if (
                !$("textInput")
                    .value
                    .trim()
            ) {

                $("textInput").value =
                    "https://www.google.com";

            }


            generateQR();

            saveSettings();

            showStatus(
                "สร้าง QR Code แล้ว",
                "success"
            );

        }
    );


/* =========================================================
   DARK MODE
========================================================= */

$("themeButton")
    .addEventListener(
        "click",
        function() {

            document.body
                .classList
                .toggle(
                    "dark"
                );


            const dark =
                document.body
                    .classList
                    .contains(
                        "dark"
                    );


            localStorage.setItem(
                "qrDarkMode",
                dark
                    ? "1"
                    : "0"
            );


            $("themeButton")
                .textContent =
                dark
                    ? "☀️"
                    : "🌙";

        }
    );


function loadDarkMode() {

    try {

        if (
            localStorage.getItem(
                "qrDarkMode"
            ) === "1"
        ) {

            document.body
                .classList
                .add(
                    "dark"
                );


            $("themeButton")
                .textContent =
                "☀️";

        }

    } catch (error) {

        console.log(
            "Dark mode unavailable"
        );

    }

}

            $("logoPreview")

            try {

                localStorage.removeItem(

            } catch (error) {}

            );

        }
    );


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
         * Ctrl + Enter
         */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            generateQR();

        }


        /*
         * Ctrl + S
         */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            downloadPNG();

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

initializeQRCode();
