<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Customizer</title>

<!-- EasyQRCodeJS 4.6.2 -->
<script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.6.2/dist/easy.qrcode.min.js"></script>

<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --soft:#f8fafc;
    --danger:#dc2626;
    --success:#16a34a;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea,
select{
    font:inherit;
}

.app{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:clamp(26px,5vw,38px);
}

.header p{
    margin:7px 0 0;
    color:var(--muted);
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 420px;
    gap:20px;
    align-items:start;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:22px;
    box-shadow:0 10px 30px rgba(15,23,42,.07);
}

.preview-card{
    position:sticky;
    top:15px;
}

.title{
    margin:0 0 18px;
    font-size:19px;
}

.group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
}

textarea,
input[type="text"],
select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:white;
    color:var(--text);
    outline:none;
}

textarea{
    min-height:105px;
    resize:vertical;
}

textarea:focus,
input[type="text"]:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.color-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.color-row{
    display:flex;
    gap:8px;
    align-items:center;
}

input[type="color"]{
    width:52px;
    height:42px;
    padding:3px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    cursor:pointer;
}

.color-text{
    min-width:0;
    flex:1;
    font-family:monospace;
}

.range-row{
    display:flex;
    gap:12px;
    align-items:center;
}

input[type="range"]{
    flex:1;
    accent-color:var(--primary);
}

.range-value{
    min-width:62px;
    padding:7px;
    background:var(--soft);
    border-radius:8px;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

.upload{
    display:block;
    border:2px dashed var(--border);
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
}

.upload:hover{
    border-color:var(--primary);
    background:#eff6ff;
}

.upload strong{
    display:block;
    margin-bottom:5px;
}

.upload span{
    color:var(--muted);
    font-size:12px;
}

#logo-file{
    display:none;
}

.logo-preview{
    display:none;
    margin-top:10px;
    align-items:center;
    gap:10px;
}

.logo-preview img{
    width:55px;
    height:55px;
    object-fit:contain;
    border:1px solid var(--border);
    border-radius:8px;
    background:white;
}

.logo-name{
    flex:1;
    min-width:0;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.remove-logo{
    border:0;
    background:#fee2e2;
    color:var(--danger);
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.url-toggle{
    margin-top:10px;
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.url-area{
    display:none;
    margin-top:9px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.buttons-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.btn{
    width:100%;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:750;
    transition:.15s;
}

.btn:active{
    transform:scale(.98);
}

.primary{
    background:var(--primary);
    color:white;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#e2e8f0;
    color:#0f172a;
}

.success{
    background:var(--success);
    color:white;
}

.danger{
    background:#fee2e2;
    color:var(--danger);
}

.status{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    font-size:13px;
}

.status.error{
    color:var(--danger);
}

.status.success{
    color:var(--success);
}

.preview{
    min-height:390px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    border:2px dashed #e2e8f0;
    border-radius:15px;
    background:#f8fafc;
    overflow:auto;
}

#qrcode{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    max-width:100%;
}

#qrcode canvas,
#qrcode img,
#qrcode svg{
    max-width:100%;
    height:auto;
}

.qr-caption{
    margin-top:9px;
    font-weight:700;
    text-align:center;
}

.empty{
    color:var(--muted);
    text-align:center;
    font-size:14px;
}

.footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:20px;
}

/* DARK */

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
    --soft:#1e293b;
}

body.dark textarea,
body.dark input[type="text"],
body.dark select{
    background:#111827;
    color:white;
}

body.dark .secondary{
    background:#334155;
    color:white;
}

body.dark .preview{
    background:#e2e8f0;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview-card{
        position:static;
    }
}

@media(max-width:520px){

    .app{
        padding:10px;
    }

    .card{
        padding:16px;
    }

    .color-grid{
        grid-template-columns:1fr;
    }

    .buttons-3{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:300px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <h1>🔳 QR Code Customizer</h1>
    <p>สร้าง QR Code พร้อมปรับแต่งและดาวน์โหลด</p>
</header>


<div class="layout">

<!-- ==============================
     SETTINGS
================================ -->

<section class="card">

<h2 class="title">⚙️ ตั้งค่า QR Code</h2>


<!-- TEXT -->

<div class="group">

<label for="text-input">
    🔗 ลิงก์เว็บไซต์ หรือข้อความ
</label>

<textarea
    id="text-input"
    maxlength="2000"
    placeholder="วาง URL หรือพิมพ์ข้อความ..."
>https://www.google.com</textarea>

</div>


<!-- COLOR -->

<div class="group">

<label>🎨 สี QR Code</label>

<div class="color-grid">

<div class="color-row">

<input
    type="color"
    id="dot-color"
    value="#0f172a"
>

<input
    type="text"
    id="dot-color-text"
    class="color-text"
    value="#0f172a"
>

</div>


<div class="color-row">

<input
    type="color"
    id="bg-color"
    value="#ffffff"
>

<input
    type="text"
    id="bg-color-text"
    class="color-text"
    value="#ffffff"
>

</div>

</div>

</div>


<!-- SIZE -->

<div class="group">

<label>📐 ขนาด QR Code</label>

<div class="range-row">

<input
    type="range"
    id="qr-size"
    min="160"
    max="500"
    step="10"
    value="280"
>

<div class="range-value">
    <span id="qr-size-value">280</span> px
</div>

</div>

</div>


<!-- ERROR -->

<div class="group">

<label for="error-level">
    🛡️ Error Correction
</label>

<select id="error-level">

<option value="L">
L — 7%
</option>

<option value="M">
M — 15%
</option>

<option value="Q">
Q — 25%
</option>

<option value="H" selected>
H — 30% (แนะนำเมื่อมีโลโก้)
</option>

</select>

</div>


<!-- LOGO -->

<div class="group">

<label>🖼️ โลโก้</label>

<label
    class="upload"
    for="logo-file"
>

<strong>📁 เลือกรูปจากเครื่อง</strong>

<span>
PNG / JPG / WEBP ขนาดไม่เกิน 5 MB
</span>

</label>

<input
    type="file"
    id="logo-file"
    accept="image/png,image/jpeg,image/webp"
>


<div
    class="logo-preview"
    id="logo-preview"
>

<img
    id="logo-preview-img"
    alt="Logo"
>

<div
    class="logo-name"
    id="logo-name"
></div>

<button
    type="button"
    class="remove-logo"
    id="remove-logo"
>
ลบ
</button>

</div>


<div
    class="url-toggle"
    id="url-toggle"
>
หรือใช้ URL รูปภาพ
</div>


<div
    class="url-area"
    id="url-area"
>

<input
    type="text"
    id="logo-url"
    placeholder="https://example.com/logo.png"
>

</div>

</div>


<!-- LOGO SIZE -->

<div class="group">

<label>🧩 ขนาดโลโก้</label>

<div class="range-row">

<input
    type="range"
    id="logo-size"
    min="30"
    max="100"
    step="5"
    value="60"
>

<div class="range-value">
    <span id="logo-size-value">60</span> px
</div>

</div>

</div>


<!-- CAPTION -->

<div class="group">

<label for="caption">
    ✏️ ข้อความใต้ QR
</label>

<input
    type="text"
    id="caption"
    maxlength="100"
    placeholder="เช่น SCAN ME"
>

</div>


<!-- MAIN BUTTON -->

<div class="buttons">

<button
    type="button"
    class="btn primary"
    id="generate"
>
🔄 สร้าง QR Code
</button>

<button
    type="button"
    class="btn secondary"
    id="reset"
>
↩️ รีเซ็ต
</button>

</div>


<!-- SECONDARY -->

<div class="buttons-3">

<button
    type="button"
    class="btn secondary"
    id="theme"
>
🌙 ธีม
</button>

<button
    type="button"
    class="btn secondary"
    id="copy"
>
📋 Copy
</button>

<button
    type="button"
    class="btn success"
    id="share"
>
📤 แชร์
</button>

</div>


<div
    id="status"
    class="status"
    aria-live="polite"
></div>

</section>


<!-- ==============================
     PREVIEW
================================ -->

<section class="card preview-card">

<h2 class="title">
👁️ ตัวอย่าง QR Code
</h2>


<div class="preview">

<div id="qrcode">

<div class="empty">
กำลังเตรียม QR Code...
</div>

</div>

</div>


<!-- DOWNLOAD -->

<div
    class="buttons"
    style="margin-top:12px;"
>

<button
    type="button"
    class="btn primary"
    id="download-png"
>
🖼️ PNG
</button>

<button
    type="button"
    class="btn secondary"
    id="download-svg"
>
🧩 SVG
</button>

</div>


<button
    type="button"
    class="btn secondary"
    id="print"
    style="margin-top:10px;"
>
📄 พิมพ์ / Save PDF
</button>


<p
    style="
        color:var(--muted);
        font-size:12px;
        text-align:center;
        margin-bottom:0;
    "
>
ทดสอบสแกน QR ก่อนนำไปใช้งานจริง
</p>

</section>

</div>


<div class="footer">
QR Code Customizer V2.1
</div>

</div>


<script>

"use strict";

/* =========================================================
   STATE
========================================================= */

let uploadedLogo = "";
let lastSvg = "";
let generating = false;


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

const textInput = $("text-input");

const dotColor = $("dot-color");
const dotColorText = $("dot-color-text");

const bgColor = $("bg-color");
const bgColorText = $("bg-color-text");

const qrSize = $("qr-size");
const qrSizeValue = $("qr-size-value");

const errorLevel = $("error-level");

const logoFile = $("logo-file");
const logoPreview = $("logo-preview");
const logoPreviewImg = $("logo-preview-img");
const logoName = $("logo-name");

const logoUrl = $("logo-url");
const urlToggle = $("url-toggle");
const urlArea = $("url-area");

const logoSize = $("logo-size");
const logoSizeValue = $("logo-size-value");

const caption = $("caption");

const qrcode = $("qrcode");

const status = $("status");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type = ""){

    status.textContent = message;

    status.className = "status";

    if(type){
        status.classList.add(type);
    }

}


/* =========================================================
   CHECK LIBRARY
========================================================= */

function libraryReady(){

    return (
        typeof window.QRCode !== "undefined" &&
        typeof window.QRCode.CorrectLevel !== "undefined"
    );

}


/* =========================================================
   HEX
========================================================= */

function validHex(value){

    return /^#[0-9A-Fa-f]{6}$/.test(value);

}


function normalizeHex(value){

    value = value.trim();

    if(!value.startsWith("#")){
        value = "#" + value;
    }

    return value.toLowerCase();

}


/* =========================================================
   COLOR
========================================================= */

dotColor.addEventListener("input", () => {

    dotColorText.value =
        dotColor.value.toLowerCase();

    scheduleGenerate();

});


bgColor.addEventListener("input", () => {

    bgColorText.value =
        bgColor.value.toLowerCase();

    scheduleGenerate();

});


dotColorText.addEventListener("change", () => {

    const value =
        normalizeHex(dotColorText.value);

    if(!validHex(value)){

        dotColorText.value =
            dotColor.value;

        setStatus(
            "สี QR ไม่ถูกต้อง",
            "error"
        );

        return;
    }

    dotColor.value = value;

    dotColorText.value = value;

    generateQR();

});


bgColorText.addEventListener("change", () => {

    const value =
        normalizeHex(bgColorText.value);

    if(!validHex(value)){

        bgColorText.value =
            bgColor.value;

        setStatus(
            "สีพื้นหลังไม่ถูกต้อง",
            "error"
        );

        return;
    }

    bgColor.value = value;

    bgColorText.value = value;

    generateQR();

});


/* =========================================================
   RANGE
========================================================= */

qrSize.addEventListener("input", () => {

    qrSizeValue.textContent =
        qrSize.value;

    scheduleGenerate();

});


logoSize.addEventListener("input", () => {

    logoSizeValue.textContent =
        logoSize.value;

    scheduleGenerate();

});


/* =========================================================
   INPUT
========================================================= */

let timer = null;

function scheduleGenerate(){

    clearTimeout(timer);

    timer = setTimeout(
        generateQR,
        200
    );

}


textInput.addEventListener(
    "input",
    scheduleGenerate
);

caption.addEventListener(
    "input",
    scheduleGenerate
);

errorLevel.addEventListener(
    "change",
    generateQR
);


/* =========================================================
   LOGO FILE
========================================================= */

logoFile.addEventListener(
"change",
function(){

    const file =
        this.files && this.files[0];

    if(!file){
        return;
    }


    const allowed = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];


    if(!allowed.includes(file.type)){

        setStatus(
            "รองรับเฉพาะ PNG, JPG และ WEBP",
            "error"
        );

        this.value = "";

        return;
    }


    if(file.size > 5 * 1024 * 1024){

        setStatus(
            "ไฟล์โลโก้ต้องไม่เกิน 5 MB",
            "error"
        );

        this.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(event){

        uploadedLogo =
            event.target.result;


        logoPreviewImg.src =
            uploadedLogo;


        logoName.textContent =
            file.name;


        logoPreview.style.display =
            "flex";


        /* Uploaded file has priority */

        logoUrl.value = "";

        generateQR();

    };


    reader.onerror = function(){

        setStatus(
            "ไม่สามารถอ่านไฟล์โลโก้ได้",
            "error"
        );

    };


    reader.readAsDataURL(file);

});


/* =========================================================
   REMOVE LOGO
========================================================= */

$("remove-logo").addEventListener(
"click",
function(){

    uploadedLogo = "";

    logoFile.value = "";

    logoPreview.style.display =
        "none";

    logoPreviewImg.removeAttribute(
        "src"
    );

    logoName.textContent = "";

    generateQR();

});


/* =========================================================
   URL LOGO
========================================================= */

urlToggle.addEventListener(
"click",
function(){

    if(urlArea.style.display === "block"){

        urlArea.style.display =
            "none";

    }else{

        urlArea.style.display =
            "block";

    }

});


logoUrl.addEventListener(
"input",
function(){

    if(this.value.trim()){

        uploadedLogo = "";

        logoFile.value = "";

        logoPreview.style.display =
            "none";

    }

    scheduleGenerate();

});


/* =========================================================
   GET LOGO
========================================================= */

function getLogo(){

    if(uploadedLogo){
        return uploadedLogo;
    }

    const url =
        logoUrl.value.trim();

    if(url){
        return url;
    }

    return "";
}


/* =========================================================
   CORRECT LEVEL
========================================================= */

function getCorrectLevel(){

    switch(errorLevel.value){

        case "L":
            return QRCode.CorrectLevel.L;

        case "M":
            return QRCode.CorrectLevel.M;

        case "Q":
            return QRCode.CorrectLevel.Q;

        case "H":
        default:
            return QRCode.CorrectLevel.H;

    }

}


/* =========================================================
   CAPTION
========================================================= */

function addCaption(){

    const text =
        caption.value.trim();

    if(!text){
        return;
    }


    const el =
        document.createElement("div");

    el.className =
        "qr-caption";

    el.textContent =
        text;

    el.style.color =
        dotColor.value;


    qrcode.appendChild(el);

}


/* =========================================================
   GENERATE
========================================================= */

function generateQR(){

    if(generating){
        return;
    }


    if(!libraryReady()){

        setStatus(
            "QR Library ยังโหลดไม่เสร็จ กำลังลองใหม่...",
            "error"
        );

        setTimeout(
            generateQR,
            500
        );

        return;
    }


    const text =
        textInput.value.trim();


    if(!text){

        qrcode.innerHTML =
            '<div class="empty">กรุณากรอกข้อความหรือ URL</div>';

        setStatus(
            "กรุณากรอกข้อมูลก่อน",
            "error"
        );

        return;
    }


    const dark =
        dotColor.value;

    const light =
        bgColor.value;


    if(
        !validHex(dark) ||
        !validHex(light)
    ){

        setStatus(
            "ค่าสีไม่ถูกต้อง",
            "error"
        );

        return;
    }


    const size =
        Number(qrSize.value);


    const requestedLogoSize =
        Number(logoSize.value);


    /*
       Never allow logo to become too large.
       Maximum 30% of QR width.
    */

    const safeLogoSize =
        Math.min(
            requestedLogoSize,
            Math.floor(size * 0.30)
        );


    const logo =
        getLogo();


    generating = true;


    qrcode.innerHTML = "";

    lastSvg = "";


    /*
       IMPORTANT:
       These are official EasyQRCodeJS options.
    */

    const options = {

        text:text,

        width:size,

        height:size,

        colorDark:dark,

        colorLight:light,

        correctห<input
                            type="color"
                            id="bg-color"
                            value="#ffffff"
                        >

                        <input
                            type="text"
                            id="bg-color-text"
                            class="color-value"
                            value="#ffffff"
                            maxlength="7"
                        >

                    </div>

                </div>

            </div>

            <!-- QR Size -->
            <div class="form-group">

                <label for="qr-size">
                    📐 ขนาด QR Code
                </label>

                <div class="range-row">

                    <input
                        type="range"
                        id="qr-size"
                        min="160"
                        max="500"
                        step="10"
                        value="280"
                    >

                    <div class="range-value">
                        <span id="qr-size-value">280</span> px
                    </div>

                </div>

            </div>

            <!-- Error Correction -->
            <div class="form-group">

                <label for="error-level">
                    🛡️ ระดับการแก้ไขข้อผิดพลาด

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let qrLibraryReady = false;

let qrInstance = null;

let qrDataUrl = "";

let logoData = "";

let renderTimer = null;

let statusTimer = null;


/* =========================================================
   SHORTCUT
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = "success"
) {

    const el =
        $("status");

    el.textContent =
        message;

    el.className =
        "status show " +
        type;

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function() {

                el.className =
                    "status";

            },
            2500
        );
}


/* =========================================================
   LOAD EXTERNAL SCRIPT
========================================================= */

function loadScript(url) {

    return new Promise(
        function(resolve, reject) {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                url;

            script.async =
                false;


            script.onload =
                function() {

                    resolve();

                };


            script.onerror =
                function() {

                    reject(
                        new Error(
                            "โหลด Library ไม่สำเร็จ"
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   LOAD QR LIBRARY
========================================================= */

async function loadQRCodeLibrary() {

    /*
     * CDN ตัวที่ 1
     */

    try {

        await loadScript(
            "https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Primary CDN failed",
            error
        );

    }


    /*
     * CDN ตัวที่ 2
     */

    try {

        await loadScript(
            "https://unpkg.com/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Fallback CDN failed",
            error
        );

    }


    return false;
}


/* =========================================================
   INIT LIBRARY
========================================================= */

async function initializeQRCode() {

    const ready =
        await loadQRCodeLibrary();


    if (!ready) {

        $("qrcode").innerHTML = `

            <div class="error-box">

                <strong>
                    ไม่สามารถโหลด QR Generator ได้
                </strong>

                <br><br>

                ตรวจสอบ Internet แล้ว
                รีเฟรชหน้าเว็บอีกครั้ง

            </div>

        `;


        showStatus(
            "โหลด QR Generator ไม่สำเร็จ",
            "error"
        );

        return;

    }


    qrLibraryReady =
        true;


    /*
     * สำคัญ:
     * เริ่มต้นด้วยค่าที่กำหนดใน HTML
     * ก่อนอ่าน localStorage
     */

    loadSettings();


    updateUI();


    /*
     * ถ้า localStorage เคยเก็บค่าว่าง
     * ให้ใช้ Google แทน
     */

    if (
        !$("textInput").value.trim()
    ) {

        $("textInput").value =
            "https://www.google.com";

    }


    generateQR();


    showStatus(
        "QR Generator พร้อมใช้งาน",
        "success"
    );

}


/* =========================================================
   GET ERROR CORRECTION
========================================================= */

function getCorrectLevel() {

    switch (
        $("errorCorrection").value
    ) {

        case "L":
            return QRCode.CorrectLevel.L;

        case "Q":
            return QRCode.CorrectLevel.Q;

        case "H":
            return QRCode.CorrectLevel.H;

        case "M":
        default:
            return QRCode.CorrectLevel.M;

    }

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    $("darkColorText").textContent =
        $("darkColor").value;


    $("lightColorText").textContent =
        $("lightColor").value;


    $("captionColorText").textContent =
        $("captionColor").value;


    $("qrSizeText").textContent =
        $("qrSize").value +
        "px";


    $("logoSizeText").textContent =
        $("logoSize").value +
        "px";


    $("captionSizeText").textContent =
        $("captionSize").value +
        "px";


    const text =
        $("textInput").value;


    $("characterCount").textContent =
        text.length +
        " ตัวอักษร";


    $("sizeInfo").textContent =
        $("qrSize").value +
        " × " +
        $("qrSize").value +
        " px";


    /*
     * Caption
     */

    const caption =
        $("caption");


    caption.textContent =
        $("captionInput").value;


    caption.style.color =
        $("captionColor").value;


    caption.style.fontSize =
        $("captionSize").value +
        "px";


    caption.style.fontWeight =
        "600";

}


/* =========================================================
   GENERATE QR
========================================================= */

function generateQR() {

    if (!qrLibraryReady) {

        return;

    }


    let text =
        $("textInput").value.trim();


    /*
     * ป้องกัน text ว่าง
     */

    if (!text) {

        text =
            "https://www.google.com";

        $("textInput").value =
            text;

    }


    const container =
        $("qrcode");


    container.innerHTML =
        "";


    qrDataUrl =
        "";


    const size =
        Number(
            $("qrSize").value
        );


    /*
     * QR Options
     */

    const options = {

        text: text,

        width: size,

        height: size,

        colorDark:
            $("darkColor").value,

        colorLight:
            $("lightColor").value,

        correctLevel:
            getCorrectLevel(),

        quietZone: 8,

        quietZoneColor:
            $("lightColor").value,

        dotScale: 1,

        utf8WithoutBOM: true,

        drawer: "canvas",

        /*
         * เมื่อสร้างเสร็จ
         */

        onRenderingEnd:
            function(
                options,
                dataURL
            ) {

                if (dataURL) {

                    qrDataUrl =
                        dataURL;

                }


                updateUI();

            }

    };


    /*
     * LOGO
     */

    const logo =
        logoData ||
        $("logoUrl").value.trim();


    if (logo) {

        options.logo =
            logo;

        options.logoWidth =
            Number(
                $("logoSize").value
            );

        options.logoHeight =
            Number(
                $("logoSize").value
            );

        options.logoBackgroundTransparent =
            !$("logoBackground").checked;

        options.logoBackgroundColor =
            $("lightColor").value;

    }


    try {

        qrInstance =
            new QRCode(
                container,
                options
            );


        updateUI();


    } catch (error) {

        console.error(
            "QR generation error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <strong>
                    สร้าง QR Code ไม่สำเร็จ
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}

            </div>

        `;


        showStatus(
            "เกิดข้อผิดพลาดในการสร้าง QR",
            "error"
        );

    }

}


/* =========================================================
   DEBOUNCE
========================================================= */

function scheduleGenerate() {

    updateUI();


    clearTimeout(
        renderTimer
    );


    renderTimer =
        setTimeout(
            function() {

                generateQR();

                saveSettings();

            },
            250
        );

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    /*
     * อย่าเก็บ logo Base64

/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    let raw = null;


    try {

        raw =
            localStorage.getItem(
                "qrCustomizerV22"
            );

    } catch (error) {

        return;

    }


    if (!raw) {

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        /*
         * สำคัญมาก:
         * ถ้าค่าว่าง ไม่เอามาทับค่า default
         */

        if (
            typeof data.text === "string" &&
            data.text.trim() !== ""
        ) {

            $("textInput").value =
                data.text;

        }


        if (
            data.dark
        ) {

            $("darkColor").value =
                data.dark;

        }


        if (
            data.light
        ) {

            $("lightColor").value =
                data.light;

        }


        if (
            data.qrSize
        ) {

            $("qrSize").value =
                data.qrSize;

        }


        if (
            data.logoSize
        ) {

            $("logoSize").value =
                data.logoSize;

        }


        if (
            data.error
        ) {

            $("errorCorrection").value =
                data.error;

        }


        if (
            typeof data.caption ===
            "string"
        ) {

            $("captionInput").value =
                data.caption;

        }


        if (
            data.captionColor
        ) {

            $("captionColor").value =
                data.captionColor;

        }


        if (
            data.captionSize

/* =========================================================
   DOWNLOAD PNG
========================================================= */

function downloadPNG() {

    if (!qrInstance) {

        showStatus(
            "QR Code ยังไม่พร้อม",
            "error"
        );

        return;

    }


    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ไม่พบภาพ QR",
            "error"
        );

        return;

    }


    const caption =
        $("captionInput")
            .value
            .trim();


    /*
     * ไม่มี Caption
     */

    if (!caption) {

        downloadCanvas(
            canvas,
            "qr-code.png"
        );

        return;

    }


    /*
     * มี Caption
     */

    const padding =
        30;


    const fontSize =
        Number(
            $("captionSize").value
        );


    const textHeight =
        fontSize +
        30;


    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width +
        padding * 2;


    output.height =
        canvas.height +
        padding * 2 +
        textHeight;


    const ctx =
        output.getContext(
            "2d"
        );


    /*
     * Background
     */

    ctx.fillStyle =
        $("lightColor").value;


    ctx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    /*
     * QR
     */

    ctx.drawImage(
        canvas,
        padding,
        padding
    );


    /*
     * Caption
     */

    ctx.fillStyle =
        $("captionColor").value;


    ctx.font =
        "600 " +
        fontSize +
        "px Segoe UI";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        caption,
        output.width / 2,
        canvas.height +
        padding +
        textHeight / 2
    );


    downloadCanvas(
        output,
        "qr-code.png"
    );

}


/* =========================================================
   DOWNLOAD CANVAS
========================================================= */

function downloadCanvas(
    canvas,
    filename
) {

    try {

        canvas.toBlob(
            function(blob) {

                if (!blob) {

                    showStatus(
                        "สร้างไฟล์ PNG ไม่สำเร็จ",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;

                link.download =
                    filename;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    function() {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );


                showStatus(
                    "ดาวน์โหลด PNG แล้ว",
                    "success"
                );

            },
            "image/png"
        );

    } catch (error) {

        console.error(
            error
        );

        showStatus(
            "ไม่สามารถดาวน์โหลด PNG ได้",
            "error"
        );

    }

}


/* =========================================================
   DOWNLOAD SVG
========================================================= */

function downloadSVG() {

    if (!qrLibraryReady) {

        showStatus(
            "QR Generator ยังไม่พร้อม",
            "error"
        );

        return;

    }


    const text =
        $("textInput").value.trim();


    if (!text) {

        showStatus(
            "กรุณากรอกข้อความ",
            "error"
        );

        return;

    }


    const container =
        document.createElement(
            "div"
        );


    /*
     * SVG Options
     */

    const options = {

        text: text,

        width:
            Number(
                $("qrSize").value
            ),

        height:
            Number(
                $("qrSize").value
            ),

        colorDark:
            $("darkColor").value,

        colorLight:
            $("lightColor").value,

        correctLevel:
            getCorrectLevel(),

        quietZone: 8,

        quietZoneColor:
            $("lightColor").value,

        dotScale: 1,

        utf8WithoutBOM: true,

        drawer: "svg"

    };


    /*
     * Logo
     */

    const logo =
        logoData ||
        $("logoUrl").value.trim();


    if (logo) {

        options.logo =
            logo;

        options.logoWidth =
            Number(
                $("logoSize").value
            );

        options.logoHeight =
            Number(
                $("logoSize").value
            );

        options.logoBackgroundTransparent =
            !$("logoBackground").checked;

        options.logoBackgroundColor =
            $("lightColor").value;

    }


    try {

        const svgQR =
            new QRCode(
                container,
                options
            );


        /*
         * รอ SVG render
         */

        setTimeout(
            function() {

                try {

                    svgQR.download(
                        "qr-code"
                    );


                    showStatus(
                        "ดาวน์โหลด SVG แล้ว",
                        "success"
                    );

                } catch (error) {

                    console.error(
                        error
                    );


                    showStatus(
                        "ดาวน์โหลด SVG ไม่สำเร็จ",
                        "error"
                    );

                }

            },
            250
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "สร้าง SVG ไม่สำเร็จ",
            "error"
        );

    }

}


/* =========================================================
   COPY QR
========================================================= */

async function copyQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.clipboard ||
        typeof ClipboardItem ===
        "undefined"
    ) {

        showStatus(
            "Browser ไม่รองรับ Copy รูปภาพ",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        await navigator.clipboard.write([

            new ClipboardItem({

                "image/png":
                    blob

            })

        ]);


        showStatus(
            "คัดลอก QR แล้ว",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Copy ไม่สำเร็จ",
            "error"
        );

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.share
    ) {

        showStatus(
            "อุปกรณ์นี้ไม่รองรับ Share",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        const file =
            new File(
                [blob],
                "qr-code.png",
                {
                    type:
                        "image/png"
                }
            );


        if (
            navigator.canShare &&
            !navigator.canShare({
                files: [file]
            })
        ) {

            showStatus(
                "อุปกรณ์นี้ไม่รองรับ Share รูปภาพ",
                "error"
            );

            return;

        }


        await navigator.share({

            title:
                "QR Code",

            text:
                $("captionInput").value ||
                "QR Code",

            files:
                [file]

        });


    } catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );

        }

    }

}

            }

                !file.type.startsWith(
                    "image/"
                )
            ) {

                showStatus(
                    "กรุณาเลือกไฟล์รูปภาพ",
                    "error"
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    logoData =
                        event.target.result;


                    $("logoUrl").value =
                        "";


                    $("logoPreviewImage").src =
                        logoData;


                    $("logoPreview").style.display =
                        "block";


                    generateQR();

            reader.onerror =
                function() {

                    showStatus(
                        "อ่านไฟล์โลโก้ไม่สำเร็จ",
                        "error"
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

    "keydown",
    function(event) {

        /*
         * Ctrl + Enter
         */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            generateQR();

        }


        /*
         * Ctrl + S
         */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            downloadPNG();

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
