<style>

* {
    box-sizing: border-box;
}

:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #cbd5e1;
    --input-bg: #ffffff;
    --preview-bg: #f8fafc;
    --danger: #dc2626;
    --success: #16a34a;
}

body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #475569;
    --input-bg: #0f172a;
    --preview-bg: #111827;
}

body {
    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background: var(--bg);

    color: var(--text);

    margin: 0;

    min-height: 100vh;

    padding: 20px;

    transition:
        background .25s,
        color .25s;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primary);

    color: white;

    border-radius: 14px;

    font-size: 25px;

    box-shadow:
        0 8px 20px rgba(37,99,235,.25);
}

h1 {
    margin: 0;

    font-size: 23px;
}

.subtitle {
    margin-top: 3px;

    color: var(--muted);

    font-size: 13px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

/* =========================
   ICON BUTTON
========================= */

.icon-btn {
    width: 42px;
    height: 42px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    border-radius: 10px;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.icon-btn:hover {
    transform: translateY(-2px);
}

/* =========================
   GRID
========================= */

.main-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(320px, 420px);

    gap: 20px;
}

/* =========================
   CARD
========================= */

.card {
    background: var(--card);

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.06);

    border: 1px solid rgba(148,163,184,.15);
}

.section-title {
    font-size: 16px;

    font-weight: 700;

    margin-bottom: 16px;
}

/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: var(--muted);
}

textarea,
input[type="text"],
input[type="number"],
select {

    width: 100%;

    padding: 11px 12px;

    border: 1px solid var(--border);

    background: var(--input-bg);

    color: var(--text);

    border-radius: 9px;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

textarea {
    min-height: 100px;

    resize: vertical;

    line-height: 1.5;
}

textarea:focus,
input:focus,
select:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.12);
}

/* =========================
   COLOR
========================= */

.color-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.color-box {
    display: flex;

    align-items: center;

    gap: 10px;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 8px;

    background: var(--input-bg);
}

input[type="color"] {
    width: 42px;

    height: 38px;

    border: none;

    padding: 0;

    background: transparent;

    cursor: pointer;
}

.color-value {
    font-family: monospace;

    font-size: 13px;

    color: var(--muted);
}

/* =========================
   RANGE
========================= */

.range-row {
    display: flex;

    align-items: center;

    gap: 12px;
}

input[type="range"] {
    flex: 1;

    accent-color: var(--primary);

    cursor: pointer;
}

.range-value {
    min-width: 50px;

    text-align: right;

    font-size: 13px;

    font-family: monospace;

    color: var(--muted);
}

/* =========================
   CHECKBOX
========================= */

.checkbox-row {
    display: flex;

    align-items: center;

    gap: 9px;

    margin-top: 10px;

    font-size: 13px;

    color: var(--muted);
}

.checkbox-row input {
    width: 17px;
    height: 17px;

    accent-color: var(--primary);
}

/* =========================
   LOGO
========================= */

.logo-preview {
    display: none;

    margin-top: 10px;

    padding: 10px;

    border: 1px dashed var(--border);

    border-radius: 10px;

    text-align: center;
}

.logo-preview img {
    max-width: 80px;

    max-height: 80px;

    object-fit: contain;
}

/* =========================
   BUTTON
========================= */

button {
    font-family: inherit;
}

.primary-btn {

    width: 100%;

    border: none;

    background: var(--primary);

    color: white;

    padding: 13px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.primary-btn:hover {
    background: var(--primary-hover);

    transform: translateY(-1px);
}

.secondary-btn {

    border: 1px solid var(--border);

    background: var(--input-bg);

    color: var(--text);

    padding: 11px 13px;

    border-radius: 9px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.secondary-btn:hover {
    transform: translateY(-1px);
}

.button-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 8px;

    margin-top: 10px;
}

.button-grid button {
    font-size: 13px;
}

/* =========================
   PREVIEW
========================= */

.preview-card {

    display: flex;

    flex-direction: column;
}

.preview-area {

    flex: 1;

    min-height: 430px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: var(--preview-bg);

    border: 2px dashed var(--border);

    border-radius: 14px;

    padding: 20px;

    overflow: hidden;
}

#qrcode {

    display: flex;

    align-items: center;

    justify-content: center;

    background: white;

    padding: 10px;

    border-radius: 8px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.08);
}

#qrcode canvas {
    max-width: 100%;
    height: auto;
}

.qr-caption {

    margin-top: 12px;

    text-align: center;

    word-break: break-word;

    max-width: 90%;
}

/* =========================
   INFO
========================= */

.info-row {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-top: 14px;

    padding-top: 12px;

    border-top: 1px solid var(--border);

    font-size: 12px;

    color: var(--muted);
}

/* =========================
   STATUS
========================= */

.status {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translate(-50%, 120px);

    background: #0f172a;

    color: white;

    padding: 12px 18px;

    border-radius: 10px;

    font-size: 13px;

    z-index: 9999;

    opacity: 0;

    transition: .3s;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.status.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =========================
   DIVIDER
========================= */

.divider {

    height: 1px;

    background: var(--border);

    margin: 22px 0;
}

/* =========================
   FILE
========================= */

.file-input {

    width: 100%;

    border: 1px dashed var(--border);

    padding: 12px;

    border-radius: 9px;

    background: var(--input-bg);

    color: var(--muted);

    cursor: pointer;

    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

    .main-grid {

        grid-template-columns: 1fr;
    }

    .preview-card {
        order: -1;
    }

    .preview-area {
        min-height: 350px;
    }
}

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 16px;
        border-radius: 14px;
    }

    h1 {
        font-size: 19px;
    }

    .subtitle {
        font-size: 11px;
    }

    .color-grid {
        grid-template-columns: 1fr;
    }

    .button-grid {
        grid-template-columns: 1fr 1fr;
    }

    .header {
        align-items: flex-start;
    }

    .logo-icon {
        width: 42px;
        height: 42px;
        font-size: 21px;
    }
}

</style>
</head>

        <label for="text-input">ลิงก์เว็บ หรือ ข้อความ</label>

    </div>

        <div class="color-item">
            <label for="dot-color">สีจุด QR Code</label>

        </div>

            <input type="color" id="bg-color" value="#ffffff">
        </div>
    </div>
    
    <!-- 3. ช่องใส่ลิงก์โลโก้ -->
    <div class="form-group">
        <label for="logo-input">URL รูปภาพโลโก้ตรงกลาง (ถ้ามี)</label>
        <input type="text" id="logo-input" placeholder="วางลิงก์รูปภาพ .png หรือ .jpg ที่นี่">
    </div>
    
    <button onclick="generateCustomQR()">สร้าง QR Code</button>
    
    <!-- พื้นที่แสดงผลลัพธ์ -->

<script>
    function generateCustomQR() {
        const textValue = document.getElementById("text-input").value;
        const dotColor = document.getElementById("dot-color").value;
        const bgColor = document.getElementById("bg-color").value;
        const logoUrl = document.getElementById("logo-input").value.trim();

        if (!textValue.trim()) {
            alert("กรุณากรอกข้อความหรือลิงก์ก่อนนะครับ");
            return;
        }

        // ล้าง QR Code อันเก่าออกก่อนสร้างอันใหม่
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";

        // กำหนด Options การปรับแต่งสำหรับ easyqrcodejs
        let options = {
            text: textValue,
            width: 240,
            height: 240,
            colorDark: dotColor,    // กำหนดสีของจุดข้อมูล
            colorLight: bgColor,    // กำหนดสีพื้นหลัง
            correctLevel: QRCode.CorrectLevel.H // ใช้ระดับ H เพื่อให้ทนทานต่อการถูกโลโก้บัง
        };

        // ตรวจสอบว่ามีการใส่ลิงก์โลโก้หรือไม่
        if (logoUrl !== "") {
            options.logo = logoUrl;
            options.logoWidth = 60;              // กำหนดความกว้างโลโก้ (หน่วยพิกเซล)
            options.logoHeight = 60;             // กำหนดความสูงโลโก้ (หน่วยพิกเซล)
            options.logoBgColor = bgColor;       // ใส่สีพื้นหลังให้ตัวโลโก้เพื่อตัดขอบให้สแกนง่ายขึ้น
            options.logoBackgroundTransparent = false; // ปิดความโปร่งแสงของพื้นหลังโลโก้
        }

        // สั่งวาด QR Code ใหม่
        new QRCode(qrContainer, options);
    }

    // เจนผลลัพธ์เริ่มต้นทันทีเมื่อเปิดหน้าเว็บ
    window.onload = function() {
        generateCustomQR();
    };
</script>

</body>
