.settings{border-top:1px solid #e4e9df;padding:18px 0}.settings summary{cursor:pointer;font-weight:600;margin-bottom:16px}.settings-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.settings-grid input{display:block;margin-top:8px;width:100%;height:44px;border:1px solid #d6dfd2;border-radius:10px;padding:8px;background:#fafbf8;font:inherit}input[type=file]{max-width:100%;font:inherit}#logoPreview{object-fit:contain;border-radius:8px}@media(max-width:650px){.settings-grid{grid-template-columns:1fr 1fr}}button:disabled{opacity:.5;cursor:wait}</style><main class="app"><h1>QR Shape Studio</h1><p>หมุนหนึ่งรอบ ค้นพบอีกภาพ · QR ที่เปลี่ยนมุมมองเป็นรูปน่ารัก</p><div class="panel"><div class="studio-label">INTERACTIVE OBJECT · 360°</div><label for="text">ลิงก์หรือข้อความ</label><textarea id="text" rows="2">https://nattapong7955-oss.github.io/Qr/</textarea><div class="row"><button class="primary" id="generate">สร้างใหม่</button><label for="shape">รูปที่ต้องการ</label><select id="shape"><option value="tree">🌲 ต้นไม้</option><option value="heart">♥ หัวใจ</option><option value="cat">🐱 แมว</option><option value="bunny">🐰 กระต่าย</option></select></div><details open class="settings"><summary>สี ขนาด และโลโก้</summary><div class="settings-grid"><label>สี QR<input id="dark" type="color" value="#14291e"></label><label>สีพื้นหลัง<input id="light" type="color" value="#ffffff"></label><label>ขนาด PNG (px)<input id="size" type="number" min="200" max="1500" value="600" required></label><label>ขอบ QR (ช่อง)<input id="margin" type="number" min="0" max="50" value="2" required></label></div><label for="logo">โลโก้</label><div class="row"><input id="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><button id="clearLogo">ลบโลโก้</button><img id="logoPreview" alt="ตัวอย่างโลโก้" hidden width="48" height="48"></div><p class="tag">กดสร้างใหม่หลังเปลี่ยนสี ขนาด หรือขอบ · โลโก้แสดงบนด้าน QR และ PNG</p></details><div class="preview"><div class="preview-label"><span>LIVE PREVIEW</span><span>ลากเพื่อหมุน ↔</span></div><canvas id="view" width="900" height="720" tabindex="0" aria-label="ชิ้นส่วน QR สามมิติหมุนเป็นรูป ใช้ลูกศรซ้ายขวาเพื่อหมุน"></canvas></div><label for="angle">มุมหมุน <span id="degrees">0° · QR</span></label><input type="range" id="angle" min="0" max="360" step="0.1" value="0"><div class="row"><button id="front">ดู QR</button><button id="side">ดูรูป</button><button id="play">▶ หมุนให้ดู</button><button id="download" class="primary">ดาวน์โหลด PNG ของ QR</button></div><p id="status" role="status"></p></div></main><script>
//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

        if (c < 128) {
          bytes.push(c);

  const h=cell/2,vertices=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]].map(v=>project(p.x+v[0],p.y+v[1],p.z+v[2]));
  const faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[0,3,7,4],[1,2,6,5]].map((indices,i)=>({indices,i,depth:indices.reduce((sum,j)=>sum+vertices[j].depth,0)/4})).sort((a,b)=>a.depth-b.depth);

 }
 if(angle===0&&logoImage){const box=scale*.22,padding=scale*.015,k=Math.min((box-padding*2)/logoImage.naturalWidth,(box-padding*2)/logoImage.naturalHeight),w=logoImage.naturalWidth*k,h=logoImage.naturalHeight*k;ctx.fillStyle=activeLight;ctx.fillRect(450-box/2,335-box/2,box,box);ctx.drawImage(logoImage,450-w/2,335-h/2,w,h);}ctx.fillStyle='#65756d';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(angle===0?'QR · มุมสแกน':angle===180?'QR · ด้านหลัง':(angle===90||angle===270)?el('shape').selectedOptions[0].textContent:'สำรวจชิ้นส่วนจากทุกมุม',450,662);

function stop(){if(animation)cancelAnimationFrame(animation);animation=null;el('play').textContent='▶ หมุนให้ดู';}
function turn(v){stop();tilt=0;el('angle').value=v;draw();}
el('angle').addEventListener('input',()=>{stop();tilt=0;draw();});el('front').onclick=()=>turn(0);el('side').onclick=()=>turn(90);el('shape').onchange=()=>{stop();tilt=0;arrange();};
function generate(){stop();tilt=0;try{const text=el('text').value.trim();if(!text)throw Error('กรุณากรอกข้อความ');if(!el('size').reportValidity()||!el('margin').reportValidity())return;activeSize=Number(el('size').value);activeMargin=Number(el('margin').value);if(!Number.isInteger(activeSize)||!Number.isInteger(activeMargin))throw Error('ขนาดและขอบต้องเป็นจำนวนเต็ม');activeDark=el('dark').value;activeLight=el('light').value;const next=qrcode(0,logoImage?'H':'M');next.addData(text,'Byte');next.make();qr=next;el('angle').value=0;arrange();el('status').textContent='พร้อมแล้ว ลองกดดูรูปหรือเลื่อนมุมหมุน';}catch(e){el('status').textContent='สร้างไม่ได้: '+e.message;}}
el('generate').onclick=generate;
el('play').onclick=()=>{
 if(animation){stop();return;}
 const start=performance.now(),from=Number(el('angle').value),duration=10000;
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){turn(90);return;}
 el('play').textContent='⏸ หยุด';el('status').textContent='หมุนครบหนึ่งรอบ · กดหยุดหรือลากเพื่อเลือกมุมได้';
 function frame(now){const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t),v=from+360*ease;el('angle').value=v>360?v%360:v;draw();if(t<1){animation=requestAnimationFrame(frame);}else{stop();el('status').textContent='หมุนครบ 360° แล้ว · เลือกรูปอื่นเพื่อลองอีกครั้ง';}}
 animation=requestAnimationFrame(frame);
};
let pointer=null;
canvas.addEventListener('pointerdown',event=>{stop();pointer={id:event.pointerId,x:event.clientX,angle:Number(el('angle').value)};canvas.setPointerCapture(event.pointerId);});
canvas.addEventListener('pointermove',event=>{if(!pointer||pointer.id!==event.pointerId)return;const v=pointer.angle+(event.clientX-pointer.x)*360/canvas.getBoundingClientRect().width;el('angle').value=((v%360)+360)%360;draw();});
function release(){pointer=null;}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const timer = setTimeout(() => { image.src = ""; reject(new Error("โหลดภาพหมดเวลา")); }, 15000);
    image.onload = () => { clearTimeout(timer); resolve(image); };
    image.onerror = () => { clearTimeout(timer); reject(new Error("โหลดภาพไม่ได้")); };
    image.src = url;
  });
}
async function validatePNG(blob) {
  const bytes = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
  const signature = [137, 80, 78, 71, 13, 10, 26, 10];
  if (!signature.every((value, i) => bytes[i] === value)) throw new Error("API ไม่ได้ส่ง PNG");
}
async function addLogo(blob, file, background) {
  const url = URL.createObjectURL(blob), logoURL = URL.createObjectURL(file);
  try {
    const [image, logo] = await Promise.all([loadImage(url), loadImage(logoURL)]);
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
    const context = canvas.getContext("2d");
    context.drawImage(image, 0, 0);
    const box = canvas.width * 0.22, padding = canvas.width * 0.015;
    const scale = Math.min((box - 2 * padding) / logo.naturalWidth, (box - 2 * padding) / logo.naturalHeight);
    context.fillStyle = background;
    context.fillRect((canvas.width - box) / 2, (canvas.height - box) / 2, box, box);
    const w = logo.naturalWidth * scale, h = logo.naturalHeight * scale;
    context.drawImage(logo, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
    return await new Promise((resolve, reject) => canvas.toBlob(
      value => value ? resolve(value) : reject(new Error("สร้าง PNG ไม่ได้")), "image/png"
    ));
  } finally { URL.revokeObjectURL(url); URL.revokeObjectURL(logoURL); }
}

el('logo').addEventListener('change',async()=>{

 try{const image=await loadImage(url);if(version!==logoVersion)return;logoImage=image;logoFile=file;el('logoPreview').src=image.src;el('logoPreview').hidden=false;generate();}
 catch{el('status').textContent='เปิดโลโก้ไม่ได้ กรุณาเลือกไฟล์ภาพใหม่';}
 finally{URL.revokeObjectURL(url);if(version===logoVersion){el('generate').disabled=false;el('download').disabled=false;}}
});

el('download').onclick=async()=>{

 el('status').textContent='ส่งคำขอดาวน์โหลด PNG แล้ว · โปรดลองสแกนไฟล์ก่อนใช้งาน';
