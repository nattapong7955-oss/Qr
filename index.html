<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
    name="theme-color"
    content="#2563eb"
>

<title>QR Code Customizer V2.2</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 20px;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background: #f1f5f9;
    color: #0f172a;

    transition:
        background .25s,
        color .25s;
}

body.dark {
    background: #0f172a;
    color: #f8fafc;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;

    --card: #ffffff;
    --input: #ffffff;

    --text: #0f172a;
    --muted: #64748b;

    --border: #cbd5e1;

    --preview: #f8fafc;

    --success: #16a34a;
    --danger: #dc2626;

    --shadow:
        0 10px 30px rgba(15, 23, 42, .07);
}

body.dark {
    --card: #1e293b;
    --input: #0f172a;

    --text: #f8fafc;
    --muted: #94a3b8;

    --border: #475569;

    --preview: #111827;

    --shadow:
        0 10px 30px rgba(0, 0, 0, .25);
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.title-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.app-icon {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background: var(--primary);
    color: white;

    font-size: 27px;

    box-shadow:
        0 10px 25px rgba(37, 99, 235, .25);
}

h1 {
    margin: 0;

    font-size: 23px;
    line-height: 1.2;
}

.subtitle {
    margin-top: 4px;

    font-size: 13px;

    color: var(--muted);
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 44px;
    height: 44px;

    border-radius: 11px;

    border: 1px solid var(--border);

    background: var(--card);
    color: var(--text);

    cursor: pointer;

    font-size: 19px;

    transition: .2s;
}

.icon-button:hover {
    transform: translateY(-2px);
}

/* =========================================================
   MAIN GRID
========================================================= */

.main-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(320px, 430px);

    gap: 20px;
}

/* =========================================================
   CARD
========================================================= */

.card {
    background: var(--card);

    border-radius: 18px;

    padding: 22px;

    box-shadow: var(--shadow);

    border:
        1px solid rgba(148, 163, 184, .15);
}

.section-title {
    margin-bottom: 16px;

    font-size: 16px;
    font-weight: 700;
}

/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;
    font-weight: 700;

    color: var(--muted);
}

textarea,
input[type="text"],
select {
    width: 100%;

    padding: 11px 12px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background: var(--input);
    color: var(--text);

    font-size: 14px;

    outline: none;

    transition: .2s;
}

textarea {
    min-height: 105px;

    resize: vertical;

    line-height: 1.5;
}

textarea:focus,
input[type="text"]:focus,
select:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, .12);
}

/* =========================================================
   COLOR
========================================================= */

.color-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.color-box {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 7px 9px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background: var(--input);
}

input[type="color"] {
    width: 44px;
    height: 38px;

    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;
}

.color-code {
    font-family: monospace;

    font-size: 12px;

    color: var(--muted);
}

/* =========================================================
   RANGE
========================================================= */

.range-row {
    display: flex;

    align-items: center;

    gap: 12px;
}

input[type="range"] {
    flex: 1;

    accent-color: var(--primary);

    cursor: pointer;
}

.range-value {
    min-width: 55px;

    text-align: right;

    color: var(--muted);

    font-family: monospace;

    font-size: 12px;
}

/* =========================================================
   FILE
========================================================= */

.file-input {
    width: 100%;

    padding: 12px;

    border:
        1px dashed var(--border);

    border-radius: 9px;

    background: var(--input);

    color: var(--muted);

    cursor: pointer;

    font-size: 13px;
}

/* =========================================================
   LOGO PREVIEW
========================================================= */

.logo-preview {
    display: none;

    margin-top: 10px;

    padding: 10px;

    text-align: center;

    border:
        1px dashed var(--border);

    border-radius: 10px;
}

.logo-preview img {
    max-width: 90px;
    max-height: 90px;

    object-fit: contain;
}

/* =========================================================
   CHECKBOX
========================================================= */

.checkbox-row {
    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--muted);

    font-size: 13px;
}

.checkbox-row input {
    width: 17px;
    height: 17px;

    accent-color: var(--primary);
}

.checkbox-row label {
    margin: 0;

    cursor: pointer;
}

/* =========================================================
   BUTTON
========================================================= */

.primary-button {
    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background: var(--primary);

    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.primary-button:hover {
    background: var(--primary-hover);

    transform: translateY(-1px);
}

.secondary-button {
    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background: var(--input);
    color: var(--text);

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.secondary-button:hover {
    transform: translateY(-1px);
}

/* =========================================================
   DIVIDER
========================================================= */

.divider {
    height: 1px;

    margin: 22px 0;

    background: var(--border);
}

/* =========================================================
   PREVIEW
========================================================= */

.preview-card {
    display: flex;

    flex-direction: column;
}

.preview-area {
    flex: 1;

    min-height: 430px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 20px;

    border:
        2px dashed var(--border);

    border-radius: 14px;

    background: var(--preview);

    overflow: hidden;
}

#qrcode {
    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    border-radius: 8px;

    background: white;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, .08);
}

#qrcode canvas,
#qrcode svg,
#qrcode img {
    display: block;

    max-width: 100%;

    height: auto;
}

.caption {
    max-width: 90%;

    margin-top: 12px;

    text-align: center;

    word-break: break-word;
}

/* =========================================================
   INFO
========================================================= */

.info-row {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    padding-top: 12px;

    margin-top: 12px;

    border-top:
        1px solid var(--border);

    color: var(--muted);

    font-size: 12px;
}

.action-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 12px;
}

/* =========================================================
   STATUS
========================================================= */

.status {
    position: fixed;

    z-index: 99999;

    left: 50%;
    bottom: 25px;

    max-width: calc(100vw - 30px);

    padding: 12px 18px;

    border-radius: 10px;

    background: #0f172a;

    color: white;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, 100px);

    transition: .3s;

    box-shadow:
        0 10px 25px
        rgba(0, 0, 0, .25);
}

.status.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

.status.error {
    background: #b91c1c;
}

.status.success {
    background: #15803d;
}

/* =========================================================
   LOADING
========================================================= */

.loading-box {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    padding: 20px;
}

.loading-spinner {
    width: 28px;
    height: 28px;

    margin: 0 auto 12px;

    border:
        3px solid #dbeafe;

    border-top-color:
        var(--primary);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   ERROR BOX
========================================================= */

.error-box {
    max-width: 320px;

    padding: 20px;

    text-align: center;

    color: var(--danger);

    font-size: 13px;

    line-height: 1.6;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 850px) {

    .main-grid {
        grid-template-columns: 1fr;
    }

    .preview-card {
        order: -1;
    }
}

@media(max-width: 500px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 16px;

        border-radius: 14px;
    }

    h1 {
        font-size: 19px;
    }

    .subtitle {
        font-size: 11px;
    }

    .app-icon {
        width: 42px;
        height: 42px;

        font-size: 22px;
    }

    .color-grid {
        grid-template-columns: 1fr;
    }

    .action-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .preview-area {
        min-height: 340px;
    }
}

</style>

</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="title-area">

        <div class="app-icon">
            ▦
        </div>

        <div>

            <h1>

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
====================================================== -->

<main class="main-grid">


<!-- =====================================================
     PREVIEW
====================================================== -->

<section class="card preview-card">

            class="secondary-button"

            Copy

        </button>

            id="shareButton"
            class="secondary-button"
            type="button">

            Share

        </button>


        <button
            id="printButton"
            class="secondary-button"
            type="button">

            พิมพ์

        </button>


        <button
            id="resetButton"
            class="secondary-button"
            type="button">

            Reset

        </button>

    </div>

</section>


<!-- =====================================================

====================================================== -->

<section class="card">

    <div class="section-title">

    </div>


    <!-- DATA -->

    <div class="form-group">

        <label for="textInput">

        </label>

        <textarea

    <!-- COLOR -->

        <label>
            สี QR Code / สีพื้นหลัง
        </label>


        <div class="color-grid">


            <div class="color-box">

                <input
                    id="lightColor"
                    type="color"

</section>

</main>

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let qrLibraryReady = false;

let qrInstance = null;

let qrDataUrl = "";

let logoData = "";

let renderTimer = null;

let statusTimer = null;


/* =========================================================
   SHORTCUT
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = "success"
) {

    const el =
        $("status");

    el.textContent =
        message;

    el.className =
        "status show " +
        type;

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            function() {

                el.className =
                    "status";

            },
            2500
        );
}


/* =========================================================
   LOAD EXTERNAL SCRIPT
========================================================= */

function loadScript(url) {

    return new Promise(
        function(resolve, reject) {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                url;

            script.async =
                false;


            script.onload =
                function() {

                    resolve();

                };


            script.onerror =
                function() {

                    reject(
                        new Error(
                            "โหลด Library ไม่สำเร็จ"
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   LOAD QR LIBRARY
========================================================= */

async function loadQRCodeLibrary() {

    /*
     * CDN ตัวที่ 1
     */

    try {

        await loadScript(
            "https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Primary CDN failed",
            error
        );

    }


    /*
     * CDN ตัวที่ 2
     */

    try {

        await loadScript(
            "https://unpkg.com/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"
        );

        if (
            typeof window.QRCode ===
            "function"
        ) {

            return true;

        }

    } catch (error) {

        console.log(
            "Fallback CDN failed",
            error
        );

    }


    return false;
}


/* =========================================================
   INIT LIBRARY
========================================================= */

async function initializeQRCode() {

    const ready =
        await loadQRCodeLibrary();


    if (!ready) {

        $("qrcode").innerHTML = `

            <div class="error-box">

                <strong>
                    ไม่สามารถโหลด QR Generator ได้
                </strong>

                <br><br>

                ตรวจสอบ Internet แล้ว
                รีเฟรชหน้าเว็บอีกครั้ง

            </div>

        `;


        showStatus(
            "โหลด QR Generator ไม่สำเร็จ",
            "error"
        );

        return;

    }


    qrLibraryReady =
        true;


    /*
     * สำคัญ:
     * เริ่มต้นด้วยค่าที่กำหนดใน HTML
     * ก่อนอ่าน localStorage
     */

    loadSettings();


    updateUI();


    /*
     * ถ้า localStorage เคยเก็บค่าว่าง
     * ให้ใช้ Google แทน
     */

    if (
        !$("textInput").value.trim()
    ) {

        $("textInput").value =
            "https://www.google.com";

    }


    generateQR();


    showStatus(
        "QR Generator พร้อมใช้งาน",
        "success"
    );

}


/* =========================================================
   GET ERROR CORRECTION
========================================================= */

function getCorrectLevel() {

    switch (
        $("errorCorrection").value
    ) {

        case "L":
            return QRCode.CorrectLevel.L;

        case "Q":
            return QRCode.CorrectLevel.Q;

        case "H":
            return QRCode.CorrectLevel.H;

        case "M":
        default:
            return QRCode.CorrectLevel.M;

    }

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    $("darkColorText").textContent =
        $("darkColor").value;


    $("lightColorText").textContent =
        $("lightColor").value;


    $("captionColorText").textContent =
        $("captionColor").value;


    $("qrSizeText").textContent =
        $("qrSize").value +
        "px";


    $("logoSizeText").textContent =
        $("logoSize").value +
        "px";


    $("captionSizeText").textContent =
        $("captionSize").value +
        "px";


    const text =
        $("textInput").value;


    $("characterCount").textContent =
        text.length +
        " ตัวอักษร";


    $("sizeInfo").textContent =

    /*
     * Caption
     */

    const caption =
        $("caption");


    caption.textContent =

/* =========================================================
   GENERATE QR
========================================================= */

function generateQR() {

    if (!qrLibraryReady) {

        return;

    }


    let text =
        $("textInput").value.trim();


    /*
     * ป้องกัน text ว่าง
     */

    if (!text) {

        text =
            "https://www.google.com";

        $("textInput").value =
            text;

    }


    const container =
        $("qrcode");


    container.innerHTML =
        "";


    qrDataUrl =
        "";


    const size =
        Number(
            $("qrSize").value
        );


    /*
     * QR Options
     */

    const options = {

        text: text,

        width: size,

        height: size,

        colorDark:
            $("darkColor").value,

        colorLight:
            $("lightColor").value,

        correctLevel:
            getCorrectLevel(),

        quietZone: 8,

        quietZoneColor:
            $("lightColor").value,

        dotScale: 1,

        utf8WithoutBOM: true,

        drawer: "canvas",

        /*
         * เมื่อสร้างเสร็จ
         */

        onRenderingEnd:
            function(
                options,
                dataURL
            ) {

                if (dataURL) {

                    qrDataUrl =
                        dataURL;

                }


                updateUI();

            }

    };


    /*
     * LOGO
     */

    const logo =
        logoData ||
        $("logoUrl").value.trim();


    if (logo) {

        options.logo =
            logo;

        options.logoWidth =
            Number(
                $("logoSize").value
            );

        options.logoHeight =
            Number(
                $("logoSize").value
            );

        options.logoBackgroundTransparent =
            !$("logoBackground").checked;

        options.logoBackgroundColor =
            $("lightColor").value;

    }


    try {

        qrInstance =
            new QRCode(
                container,
                options
            );


        updateUI();


    } catch (error) {

        console.error(
            "QR generation error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <strong>
                    สร้าง QR Code ไม่สำเร็จ
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}

            </div>

        `;


        showStatus(
            "เกิดข้อผิดพลาดในการสร้าง QR",
            "error"
        );

    }

}


/* =========================================================
   DEBOUNCE
========================================================= */

function scheduleGenerate() {

    updateUI();


    clearTimeout(
        renderTimer
    );


    renderTimer =
        setTimeout(
            function() {

                generateQR();

                saveSettings();

            },
            250
        );

}

/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    let raw = null;


    try {

        raw =
            localStorage.getItem(
                "qrCustomizerV22"
            );

    } catch (error) {

        return;

    }


    if (!raw) {

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        /*
         * สำคัญมาก:
         * ถ้าค่าว่าง ไม่เอามาทับค่า default
         */

        if (
            typeof data.text === "string" &&
            data.text.trim() !== ""
        ) {

            $("textInput").value =
                data.text;

        }


        if (
            data.dark
        ) {

            $("darkColor").value =
                data.dark;

        }


        if (
            data.light
        ) {

            $("lightColor").value =
                data.light;

        }


        if (
            data.qrSize
        ) {

            $("qrSize").value =
                data.qrSize;

        }


        if (
            data.logoSize
        ) {

            $("logoSize").value =
                data.logoSize;

        }


        if (
            data.error
        ) {

            $("errorCorrection").value =
                data.error;

        }


        if (
            typeof data.caption ===
            "string"
        ) {

            $("captionInput").value =
                data.caption;

        }


        if (
            data.captionColor
        ) {

            $("captionColor").value =
                data.captionColor;

        }


        if (
            data.captionSize
        ) {

            $("captionSize").value =
                data.captionSize;

        }


        if (
            typeof data.logoBackground ===
            "boolean"
        ) {

            $("logoBackground").checked =
                data.logoBackground;

        }


        if (
            typeof data.logoUrl ===
            "string"
        ) {

            $("logoUrl").value =
                data.logoUrl;

        }

    } catch (error) {

        console.log(
            "Settings corrupted"
        );


        /*
         * ล้างเฉพาะ Settings ที่เสีย
         */

        localStorage.removeItem(
            "qrCustomizerV22"
        );

    }

}


/* =========================================================
   DOWNLOAD PNG
========================================================= */

function downloadPNG() {

    if (!qrInstance) {

        showStatus(
            "QR Code ยังไม่พร้อม",
            "error"
        );

        return;

    }


    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ไม่พบภาพ QR",
            "error"
        );

        return;

    }


    const caption =
        $("captionInput")
            .value
            .trim();


    /*
     * ไม่มี Caption
     */

    if (!caption) {

        downloadCanvas(
            canvas,
            "qr-code.png"
        );

        return;

    }


    /*
     * มี Caption
     */

    const padding =
        30;


    const fontSize =
        Number(
            $("captionSize").value
        );


    const textHeight =
        fontSize +
        30;


    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width +
        padding * 2;


    output.height =
        canvas.height +
        padding * 2 +
        textHeight;


    const ctx =
        output.getContext(
            "2d"
        );


    /*
     * Background
     */

    ctx.fillStyle =
        $("lightColor").value;


    ctx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    /*
     * QR
     */

    ctx.drawImage(
        canvas,
        padding,
        padding
    );


    /*
     * Caption
     */

    ctx.fillStyle =
        $("captionColor").value;


    ctx.font =
        "600 " +
        fontSize +
        "px Segoe UI";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        caption,
        output.width / 2,
        canvas.height +
        padding +
        textHeight / 2
    );


    downloadCanvas(
        output,
        "qr-code.png"
    );

}


/* =========================================================
   DOWNLOAD CANVAS
========================================================= */

function downloadCanvas(
    canvas,
    filename
) {

    try {

        canvas.toBlob(
            function(blob) {

                if (!blob) {

                    showStatus(
                        "สร้างไฟล์ PNG ไม่สำเร็จ",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;

                link.download =
                    filename;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    function() {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );


                showStatus(
                    "ดาวน์โหลด PNG แล้ว",
                    "success"
                );

            },
            "image/png"
        );

    } catch (error) {

        console.error(
            error
        );

        showStatus(
            "ไม่สามารถดาวน์โหลด PNG ได้",
            "error"
        );

    }

}

/* =========================================================
   COPY QR
========================================================= */

async function copyQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.clipboard ||
        typeof ClipboardItem ===
        "undefined"
    ) {

        showStatus(
            "Browser ไม่รองรับ Copy รูปภาพ",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        await navigator.clipboard.write([

            new ClipboardItem({

                "image/png":
                    blob

            })

        ]);


        showStatus(
            "คัดลอก QR แล้ว",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Copy ไม่สำเร็จ",
            "error"
        );

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareQR() {

    const canvas =
        $("qrcode")
            .querySelector(
                "canvas"
            );


    if (!canvas) {

        showStatus(
            "ยังไม่มี QR Code",
            "error"
        );

        return;

    }


    if (
        !navigator.share
    ) {

        showStatus(
            "อุปกรณ์นี้ไม่รองรับ Share",
            "error"
        );

        return;

    }


    try {

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        const file =
            new File(
                [blob],
                "qr-code.png",
                {
                    type:
                        "image/png"
                }
            );


        if (
            navigator.canShare &&
            !navigator.canShare({
                files: [file]
            })
        ) {

            showStatus(
                "อุปกรณ์นี้ไม่รองรับ Share รูปภาพ",
                "error"
            );

            return;

        }


        await navigator.share({

            title:
                "QR Code",

            text:
                $("captionInput").value ||
                "QR Code",

            files:
                [file]

        });


    } catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );

        }

    }

}

$("logoFile")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files &&
                this.files[0];


            if (!file) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showStatus(
                    "กรุณาเลือกไฟล์รูปภาพ",
                    "error"
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    logoData =
                        event.target.result;


                    $("logoUrl").value =
                        "";


                    $("logoPreviewImage").src =
                        logoData;


                    $("logoPreview").style.display =
                        "block";


                    generateQR();

                };


            reader.onerror =
                function() {

                    showStatus(
                        "อ่านไฟล์โลโก้ไม่สำเร็จ",
                        "error"
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

             event.metaKey) &&
            event.key === "Enter"
        ) {

         * Ctrl + S

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
